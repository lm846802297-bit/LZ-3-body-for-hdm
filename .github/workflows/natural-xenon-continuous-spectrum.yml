name: Natural-xenon continuous three-body recoil spectrum

concurrency:
  group: natural-xenon-continuous-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - research/afh-default-density-xe131-mainline
    paths:
      - .github/workflows/natural-xenon-continuous-spectrum.yml
      - research/figure2_full_reproduction/run_natural_xenon_continuous_spectrum.py
      - research/figure2_full_reproduction/run_natural_xenon_halo_fold.py
      - research/figure2_full_reproduction/run_natural_xenon_joint.py
      - research/figure2_full_reproduction/joint_xe131.py
      - research/figure2_full_reproduction/isotope_mass_schemes.py
      - research/figure2_full_reproduction/eq6_kernel.py
      - research/figure2_full_reproduction/tests/test_natural_xenon_continuous_spectrum.py
      - research/figure2_full_reproduction/tests/test_natural_xenon_halo_fold.py
      - research/figure2_full_reproduction/tests/test_joint_xe131.py
      - "research/figure2_full_reproduction/results/anand_wm_response/xe*_GCN_WM.csv"
      - "research/figure2_full_reproduction/results/anand_wm_response/xe*_JJ55_WM.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run Figure-2 and continuous-spectrum regression tests
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_*.py' -v

  compute:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - red_ms200_dm1
          - green_ms300_dm1
          - black_ms360_dm1
          - blue_ms300_dm10
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Compute continuous natural-xenon spectrum for ${{ matrix.benchmark }}
        run: |
          python research/figure2_full_reproduction/run_natural_xenon_continuous_spectrum.py \
            --out-dir "$RUNNER_TEMP/natural_xenon_continuous" \
            --benchmarks "${{ matrix.benchmark }}" \
            --mass-scheme nist_nuclear \
            --er-min-keV 5 --er-max-keV 800 \
            --er-step-keV 5 --fine-er-max-keV 270 --high-er-step-keV 20 \
            --mchi-GeV 1000 --mV-GeV 10 \
            --coupling-product-sq 1e-8 --rhoDM-GeV-cm3 0.3 --g2 1 \
            --v0-km-s 220 --ve-km-s 232 --vesc-km-s 544 \
            --nv 32 --nw 8 --nz 8 --nphi 4 \
            --nv-low 16 --nw-high 16 --nz-high 16 --nphi-high 8 \
            --max-relative-check 5e-3
      - name: Package benchmark-specific output
        run: |
          mkdir -p "$RUNNER_TEMP/continuous_bundle/${{ matrix.benchmark }}"
          cp "$RUNNER_TEMP/natural_xenon_continuous/"* \
            "$RUNNER_TEMP/continuous_bundle/${{ matrix.benchmark }}/"
      - name: Upload benchmark-specific continuous spectrum
        uses: actions/upload-artifact@v4
        with:
          name: natural-xenon-continuous-${{ matrix.benchmark }}
          path: ${{ runner.temp }}/continuous_bundle/
          if-no-files-found: error
          retention-days: 90

  archive:
    needs: compute
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/afh-default-density-xe131-mainline'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download all benchmark spectra
        uses: actions/download-artifact@v4
        with:
          pattern: natural-xenon-continuous-*
          merge-multiple: true
          path: ${{ runner.temp }}/continuous_merged/
      - name: Commit continuous spectra to research branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p research/figure2_full_reproduction/results/natural_xenon_continuous_spectrum
          cp -r "$RUNNER_TEMP/continuous_merged/"* \
            research/figure2_full_reproduction/results/natural_xenon_continuous_spectrum/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/figure2_full_reproduction/results/natural_xenon_continuous_spectrum
          if git diff --cached --quiet; then
            echo "Continuous-spectrum archive is already current."
            exit 0
          fi
          git commit -m "data: archive continuous natural-xenon recoil spectra [skip ci]"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
