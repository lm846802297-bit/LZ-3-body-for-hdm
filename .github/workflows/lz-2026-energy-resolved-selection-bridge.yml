name: LZ 2026 energy-resolved Fig S2 residual-selection bridge

on:
  push:
    branches:
      - integration/lz-2026-nest-nr-fullband-20261115
    paths:
      - research/lz_detector_response/audit_lz_2026_energy_resolved_selection_bridge.py
      - research/lz_detector_response/tests/test_lz_2026_energy_resolved_selection_bridge.py
      - .github/workflows/lz-2026-energy-resolved-selection-bridge.yml
  workflow_dispatch:

concurrency:
  group: lz-2026-energy-resolved-selection-bridge-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  energy-resolved-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test energy-resolved selection bridge
        run: |
          python -m unittest \
            research.lz_detector_response.tests.test_lz_2026_energy_resolved_selection_bridge -v

      - name: Download archived event-weighted response and Fig S2 inputs
        uses: actions/download-artifact@v4
        with:
          name: lz-2026-three-body-response-grid-convergence
          run-id: 43697104437
          repository: lm846802297-bit/LZ-3-body-for-hdm
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: extracted/

      - name: Build energy-resolved residual-stage bridge
        run: |
          python research/lz_detector_response/audit_lz_2026_energy_resolved_selection_bridge.py \
            --response-dir extracted/response-output \
            --efficiency-csv extracted/selection-audit-output/lz_2026_nr_selection_efficiency_components.csv \
            --reference-bridge-dir extracted/convergence-output/conditional_selection_bridge \
            --response-families eft2024 tableS5 \
            --benchmarks red_ms200_dm1 green_ms300_dm1 black_ms360_dm1 blue_ms300_dm10 \
            --nuclear-models GCN JJ55 \
            --source-run-id 43697104437 \
            --source-artifact-id 14155360851 \
            --out-dir energy-bridge-output
          cat energy-bridge-output/energy_resolved_selection_bridge_summary.json
          head -n 8 energy-bridge-output/energy_resolved_selection_bridge_summary.csv

      - name: Upload energy-resolved bridge tables
        uses: actions/upload-artifact@v4
        with:
          name: lz-2026-energy-resolved-selection-bridge
          path: energy-bridge-output/
          if-no-files-found: error
          retention-days: 60
