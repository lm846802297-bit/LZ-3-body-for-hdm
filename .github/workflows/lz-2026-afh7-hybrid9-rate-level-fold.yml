name: LZ 2026 AFH-7 and Hybrid-9 efficiency-weighted rate-level fold

on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - .github/workflows/lz-2026-afh7-hybrid9-rate-level-fold.yml
      - research/figure2_full_reproduction/fold_lz_2026_rate_level.py
      - research/figure2_full_reproduction/fold_lz_2026_afh_hybrid9_rate_level.py
      - research/figure2_full_reproduction/tests/test_lz_2026_afh_hybrid9_rate_level_fold.py
      - research/lz_detector_response/lz_2026_extended_nr/lz_2026_nr_efficiency_digitized.csv
      - research/afh_default_density_natural_xenon_halo/results/afh7_hybrid9_continuous_2026-11-14/afh_hybrid9_natural_xenon_spectrum.csv
      - research/afh_default_density_natural_xenon_halo/results/afh7_hybrid9_continuous_2026-11-14/metadata.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afh-lz-rate-level-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rate-level fold regression tests
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_lz_2026_*fold.py' -v

      - name: Run AFH-7 and Hybrid-9 LZ efficiency fold
        run: |
          python research/figure2_full_reproduction/fold_lz_2026_afh_hybrid9_rate_level.py \
            --out-dir "$RUNNER_TEMP/afh7_hybrid9_rate_level"

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: lz-2026-afh7-hybrid9-rate-level-yields
          path: ${{ runner.temp }}/afh7_hybrid9_rate_level/
          if-no-files-found: error
          retention-days: 90

      - name: Archive CSV, metadata and SHA-256 manifest on the source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          target="research/lz_detector_response/lz_2026_extended_nr/afh7_hybrid9_rate_level_yields"
          mkdir -p "$target"
          cp "$RUNNER_TEMP/afh7_hybrid9_rate_level/"* "$target/"
          git add "$target"
          if git diff --cached --quiet; then
            echo "AFH-7/Hybrid-9 LZ rate-level archive is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: archive AFH-7 and Hybrid-9 LZ rate-level yields [skip ci]"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
