name: Retrieve official LZ 2026 HEPData release

on:
  push:
    branches:
      - research/afh-default-density-xe131-mainline
    paths:
      - .github/workflows/lz-2026-hepdata-download.yml
      - research/figure2_full_reproduction/extract_lz_2026_nr_efficiency.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrieve-hepdata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Retrieve HEPData YAML submission
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/lz_hepdata"
          yaml_url="https://www.hepdata.net/download/submission/ins3199115/1/yaml"
          yaml_code=$(curl -L --max-time 120 -A "Mozilla/5.0" -sS \
            -o "$RUNNER_TEMP/lz_hepdata/submission.yaml" -w "%{http_code}" "$yaml_url")
          yaml_status=$?
          if [ "$yaml_status" -eq 0 ] && [ "$yaml_code" = "200" ] && [ -s "$RUNNER_TEMP/lz_hepdata/submission.yaml" ]; then
            echo "Downloaded HEPData YAML submission (HTTP $yaml_code)." > "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"
            sha256sum "$RUNNER_TEMP/lz_hepdata/submission.yaml" >> "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"
          else
            json_url="https://www.hepdata.net/record/ins3199115?format=json"
            json_code=$(curl -L --max-time 120 -A "Mozilla/5.0" -sS \
              -o "$RUNNER_TEMP/lz_hepdata/record.json" -w "%{http_code}" "$json_url")
            json_status=$?
            if [ "$json_status" -eq 0 ] && [ "$json_code" = "200" ] && [ -s "$RUNNER_TEMP/lz_hepdata/record.json" ]; then
              echo "YAML endpoint unavailable (HTTP $yaml_code); downloaded HEPData JSON record (HTTP $json_code)." > "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"
              sha256sum "$RUNNER_TEMP/lz_hepdata/record.json" >> "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"
            else
              {
                echo "HEPData YAML download failed: HTTP $yaml_code (curl status $yaml_status)."
                echo "HEPData JSON download failed: HTTP $json_code (curl status $json_status)."
                echo "The official data-release DOI is https://doi.org/10.17182/hepdata.182472.v1."
              } > "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"
            fi
          fi
          cat "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"

      - name: Download the official arXiv PDF for response-curve extraction
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --max-time 120 -A "Mozilla/5.0" \
            -o "$RUNNER_TEMP/lz_hepdata/lz_2026_extended_nr_search.pdf" \
            "https://arxiv.org/pdf/2609.02823"
          sha256sum "$RUNNER_TEMP/lz_hepdata/lz_2026_extended_nr_search.pdf" \
            >> "$RUNNER_TEMP/lz_hepdata/DOWNLOAD_STATUS.txt"

      - name: Extract final NR efficiency curve from the official PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python research/figure2_full_reproduction/extract_lz_2026_nr_efficiency.py \
            --pdf "$RUNNER_TEMP/lz_hepdata/lz_2026_extended_nr_search.pdf" \
            --out-dir "$RUNNER_TEMP/lz_efficiency_extracted"
          cp "$RUNNER_TEMP/lz_efficiency_extracted/"* "$RUNNER_TEMP/lz_hepdata/"

      - name: Archive efficiency curve and extraction metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p research/lz_detector_response/lz_2026_extended_nr
          cp "$RUNNER_TEMP/lz_efficiency_extracted/lz_2026_nr_efficiency_digitized.csv" \
            research/lz_detector_response/lz_2026_extended_nr/
          cp "$RUNNER_TEMP/lz_efficiency_extracted/lz_2026_nr_efficiency_metadata.json" \
            research/lz_detector_response/lz_2026_extended_nr/
          cp "$RUNNER_TEMP/lz_efficiency_extracted/lz_2026_figS2.svg" \
            research/lz_detector_response/lz_2026_extended_nr/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lz_detector_response/lz_2026_extended_nr
          if git diff --cached --quiet; then
            echo "LZ efficiency curve archive is already current."
            exit 0
          fi
          git commit -m "data: archive digitized LZ 2026 NR efficiency curve [skip ci]"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload HEPData retrieval attempt
        uses: actions/upload-artifact@v4
        with:
          name: lz-2026-hepdata-data-release
          path: ${{ runner.temp }}/lz_hepdata/
          if-no-files-found: error
          retention-days: 90
