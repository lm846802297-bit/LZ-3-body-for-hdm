name: AFH spatial-response Python pre-audit

on:
  push:
    paths:
      - "research/afh_default_density_xe131/run_afh_spatial_response_audit.py"
      - "research/afh_default_density_xe131/tests/test_afh_spatial_response_audit.py"
      - "research/afh_default_density_natural_xenon_halo/input/afh_default_density_matrices/**"
      - "v6/dmformfactor-V6.m"
      - ".github/workflows/afh-spatial-response-python.yml"
  pull_request:
    paths:
      - "research/afh_default_density_xe131/run_afh_spatial_response_audit.py"
      - "research/afh_default_density_xe131/tests/test_afh_spatial_response_audit.py"
      - "research/afh_default_density_natural_xenon_halo/input/afh_default_density_matrices/**"
      - "v6/dmformfactor-V6.m"
      - ".github/workflows/afh-spatial-response-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-preaudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy sympy
      - name: Record numerical environment
        run: |
          python --version
          python -c "import numpy, scipy, sympy; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('sympy', sympy.__version__)"
      - name: Run spatial-response unit and smoke tests
        run: python -m unittest research.afh_default_density_xe131.tests.test_afh_spatial_response_audit -v
      - name: Run provisional selected-q Python translation on native q anchors
        run: >-
          python research/afh_default_density_xe131/run_afh_spatial_response_audit.py
          --outdir "$RUNNER_TEMP/afh-spatial-response-python"
          --q 0 0.05 0.10 0.158 0.20 0.25625 0.30 0.365 0.45 0.49925 0.60
      - name: Record output checksums
        run: |
          cd "$RUNNER_TEMP/afh-spatial-response-python"
          sha256sum afh_spatial_response_selected_q.csv metadata.json > sha256_manifest.txt
          cat sha256_manifest.txt
      - name: Upload provisional Python outputs
        uses: actions/upload-artifact@v4
        with:
          name: afh-spatial-response-python-provisional
          path: |
            ${{ runner.temp }}/afh-spatial-response-python/afh_spatial_response_selected_q.csv
            ${{ runner.temp }}/afh-spatial-response-python/metadata.json
            ${{ runner.temp }}/afh-spatial-response-python/sha256_manifest.txt
          if-no-files-found: error
          retention-days: 14
