name: Repository layout

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  layout-check:
    name: layout-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check top-level structure and research indexes
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path(".")
          allowed_root_dirs = {".git", ".github", "paper-source", "research", "v6"}
          errors = []

          unexpected = sorted(
              p.name for p in root.iterdir()
              if p.is_dir() and p.name not in allowed_root_dirs
          )
          if unexpected:
              errors.append(
                  "Unexpected top-level directories: " + ", ".join(unexpected)
              )

          for required in (
              Path("README.md"),
              Path("CONTRIBUTING.md"),
              Path("research/README.md"),
              Path("research/WORKFLOW.md"),
              Path("paper-source/main_original.tex"),
          ):
              if not required.is_file():
                  errors.append(f"Missing required repository file: {required}")

          research = Path("research")
          if research.is_dir():
              for directory in sorted(p for p in research.iterdir() if p.is_dir()):
                  if not (directory / "README.md").is_file():
                      errors.append(
                          f"Research directory has no README.md: {directory}"
                      )

          if errors:
              print("\n".join(f"ERROR: {item}" for item in errors))
              sys.exit(1)

          print("Repository layout check passed.")
          PY

      - name: Verify Figure 2 benchmark/input/output SHA-256 manifest
        run: python research/docs/supplements/validate_figure2_manifest.py

  black-s1-upper-tail:
    name: black-s1-upper-tail
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/lz-2026-nest-nr-fullband-20261115' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download immutable ten-seed production artifact
        uses: actions/download-artifact@v4
        with:
          name: lz-2026-paired-s1-independent-seeds
          repository: lm846802297-bit/LZ-3-body-for-hdm
          run-id: 43750948249
          github-token: ${{ github.token }}
          path: paired-s1-independent-seeds-input

      - name: Verify production artifact file manifest
        working-directory: paired-s1-independent-seeds-input
        run: sha256sum --check SHA256SUMS

      - name: Test paired S1 upper-tail audit
        run: |
          python -m unittest research.lz_detector_response.tests.test_lz_2026_paired_s1_upper_tail -v

      - name: Run exact event-weighted ten-seed black S1 upper-tail audit
        run: |
          python research/lz_detector_response/audit_lz_2026_paired_s1_upper_tail.py \\
            --seed-root paired-s1-independent-seeds-input \\
            --seeds 20261117 40261117 60261117 80261117 100261117 120261117 140261117 160261117 180261117 200261117 \\
            --spectrum-dir research/figure2_full_reproduction/results/natural_xenon_continuous_spectrum \\
            --bootstrap-replicates 2000 \\
            --out-dir black-s1-upper-tail-output

      - name: Validate ten-seed coverage and output closure
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path("black-s1-upper-tail-output")
          summary=list(csv.DictReader((root/"black_s1_upper_tail_summary.csv").open()))
          per_seed=list(csv.DictReader((root/"black_s1_upper_tail_per_seed.csv").open()))
          thresholds=list(csv.DictReader((root/"black_s1_upper_tail_thresholds.csv").open()))
          meta=json.loads((root/"black_s1_upper_tail_metadata.json").read_text())
          expected=[20261117,40261117,60261117,80261117,100261117,120261117,140261117,160261117,180261117,200261117]
          assert meta["status"]=="TEN_SEED_BLACK_S1_UPPER_TAIL_DIAGNOSTIC_ONLY"
          assert meta["seed_count"]==10 and meta["total_events_audited"]==4700000
          assert meta["seeds"]==expected
          assert len(summary)==12 and len(per_seed)==120 and len(thresholds)==1200
          assert meta["n_summary_rows"]==12 and meta["n_per_seed_rows"]==120 and meta["n_threshold_rows"]==1200
          for row in summary:
              assert int(row["n_independent_seeds"])==10
              assert 0 <= float(row["ensemble_mean_s1_conditional_histogram_tv_10phd"]) <= 1
              assert 0 <= float(row["ensemble_mean_s1_upper_tail_histogram_tv_10phd_given_s1_gt_500"]) <= 1
          print("Validated 12 summary, 120 per-seed, and 1,200 threshold rows from 4.7M events.")
          PY

      - name: Hash audit outputs
        run: |
          find black-s1-upper-tail-output -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > black-s1-upper-tail-output/SHA256SUMS

      - name: Upload black S1 upper-tail audit
        uses: actions/upload-artifact@v4
        with:
          name: lz-2026-paired-s1-black-upper-tail
          path: black-s1-upper-tail-output/
          if-no-files-found: error
          retention-days: 60
