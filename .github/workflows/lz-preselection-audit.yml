name: LZ pre-selection recoil-grid and response-audit checks

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lz-preselection-audit.yml
      - research/afh_default_density_natural_xenon_halo/compare_5kev_1kev_recoil_grid.py
      - research/afh_default_density_natural_xenon_halo/tests/test_recoil_grid_convergence.py
      - research/afh_default_density_natural_xenon_halo/run_1kev_recoil_grid_convergence.ps1
      - research/lz_detector_response/lz_2026_extended_nr/audit_lz_nr_conditional_2d_pdf.py
      - research/lz_detector_response/lz_2026_extended_nr/test_audit_lz_nr_conditional_2d_pdf.py
      - research/lz_detector_response/lz_2026_extended_nr/S1_COINCIDENCE_AND_SELECTION_AUDIT.md
      - research/lz_detector_response/lz_2026_extended_nr/lz_nr_event_level_selection_schema.json
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - .github/workflows/lz-preselection-audit.yml
      - research/afh_default_density_natural_xenon_halo/compare_5kev_1kev_recoil_grid.py
      - research/afh_default_density_natural_xenon_halo/tests/test_recoil_grid_convergence.py
      - research/lz_detector_response/lz_2026_extended_nr/audit_lz_nr_conditional_2d_pdf.py
      - research/lz_detector_response/lz_2026_extended_nr/test_audit_lz_nr_conditional_2d_pdf.py
      - research/lz_detector_response/lz_2026_extended_nr/S1_COINCIDENCE_AND_SELECTION_AUDIT.md
      - research/lz_detector_response/lz_2026_extended_nr/lz_nr_event_level_selection_schema.json

permissions:
  contents: read

jobs:
  structural-and-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/afh_default_density_xe131/requirements.txt

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/afh_default_density_xe131/requirements.txt

      - name: Compile new audit tools
        run: |
          python -m py_compile research/afh_default_density_natural_xenon_halo/compare_5kev_1kev_recoil_grid.py
          python -m py_compile research/lz_detector_response/lz_2026_extended_nr/audit_lz_nr_conditional_2d_pdf.py

      - name: Validate event-level cutflow schema
        run: |
          python -m json.tool research/lz_detector_response/lz_2026_extended_nr/lz_nr_event_level_selection_schema.json > /dev/null

      - name: Test recoil-grid comparator
        run: |
          python -m unittest discover \
            -s research/afh_default_density_natural_xenon_halo/tests \
            -p "test_recoil_grid_convergence.py" -v

      - name: Test conditional 2D PDF audit
        run: |
          python -m unittest discover \
            -s research/lz_detector_response/lz_2026_extended_nr \
            -p "test_audit_lz_nr_conditional_2d_pdf.py" -v

      - name: Test existing LZ rate-level fold remains stable
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p "test_lz_2026_afh_hybrid9_rate_level_fold.py" -v
