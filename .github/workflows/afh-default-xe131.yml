name: AFH default Xe-131 nuclear response

concurrency:
  group: afh-default-xe131-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - research/figure2-p0-4-mainline
      - research/afh-default-density-xe131-mainline
    paths:
      - .github/workflows/afh-default-xe131.yml
      - research/afh_default_density_xe131/**
      - research/afh_default_density_natural_xenon_halo/**
  pull_request:
    branches:
      - main
      - research/figure2-p0-4-mainline
    paths:
      - .github/workflows/afh-default-xe131.yml
      - research/afh_default_density_xe131/**
      - research/afh_default_density_natural_xenon_halo/**

permissions:
  contents: write

jobs:
  reproduce-afh-default-xe131:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/afh_default_density_xe131/requirements.txt

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/afh_default_density_xe131/requirements.txt

      - name: Compile Python/MMA comparison utility
        run: |
          python -m py_compile research/afh_default_density_xe131/compare_afh_mathematica_python.py

      - name: Compile natural-xenon halo-fold runner
        run: |
          python -m py_compile research/afh_default_density_natural_xenon_halo/run_afh_natural_xenon_halo_fold.py

      - name: Verify natural-xenon target-number metadata
        run: |
          python -m unittest discover \
            -s research/afh_default_density_natural_xenon_halo \
            -p "test_target_number.py" -v

      - name: Parse native Windows PowerShell runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "research/afh_default_density_xe131/run_native_afh_audit.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Run AFH response and four-benchmark regression tests
        run: |
          python -m unittest discover \
            -s research/afh_default_density_xe131 \
            -p "test_*.py" -v

      - name: Run Figure-2 joint-response q-convention regression tests
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_joint_xe131.py' -v
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_natural_xenon_joint.py' -v

      - name: Recompute AFH default response
        run: |
          python research/afh_default_density_xe131/run_afh_default_xe131.py \
            --outdir "$RUNNER_TEMP/afh_default_xe131"

      - name: Audit AFH response and exact kinematic momentum conventions
        run: |
          python research/afh_default_density_xe131/audit_response_momentum_conventions.py \
            --xe131-response-csv "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.csv" \
            --outdir "$RUNNER_TEMP/afh_q_convention_audit"

      - name: Run independent 60-digit mpmath comparison on all 2401 q nodes
        run: |
          python research/afh_default_density_xe131/verify_afh_mpmath_full_grid.py \
            --response-csv "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.csv" \
            --outdir "$RUNNER_TEMP/afh_mpmath_full_grid"

      - name: Regenerate response plot
        run: |
          python research/afh_default_density_xe131/plot_afh_default_xe131.py \
            --csv "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.csv" \
            --output "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.png"

      - name: Recompute AFH four-benchmark cross sections
        run: |
          python research/afh_default_density_xe131/recompute_afh_four_benchmarks.py \
            --base-csv research/afh_default_density_xe131/input/figure2_recalc_mV10_g2_1_v800_Xe131_full_5keV.csv \
            --afh-response-csv "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.csv" \
            --outdir "$RUNNER_TEMP/afh_four_benchmarks" \
            --plots

      - name: Upload AFH response-momentum convention audit
        uses: actions/upload-artifact@v4
        with:
          name: afh-q-convention-audit
          path: ${{ runner.temp }}/afh_q_convention_audit/
          if-no-files-found: error
          retention-days: 90

      - name: Upload full-grid mpmath validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: afh-xe131-mpmath-full-grid-validation
          path: ${{ runner.temp }}/afh_mpmath_full_grid/
          if-no-files-found: error
          retention-days: 90

      - name: Upload numerical reproduction artifact
        uses: actions/upload-artifact@v4
        with:
          name: afh-default-xe131-response
          path: ${{ runner.temp }}/afh_default_xe131/
          if-no-files-found: error
          retention-days: 90

      - name: Upload four-benchmark response-substitution artifact
        uses: actions/upload-artifact@v4
        with:
          name: afh-xe131-four-benchmarks
          path: ${{ runner.temp }}/afh_four_benchmarks/
          if-no-files-found: error
          retention-days: 90

      - name: Archive exact-spatial AFH outputs in the research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/afh-default-density-xe131-mainline'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.csv" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_default_xe131/afh_default_xe131_WM00.png" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_default_xe131/figure2_dip_check.csv" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_default_xe131/minima.csv" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_default_xe131/metadata.json" research/afh_default_density_xe131/output/metadata.json
          cp "$RUNNER_TEMP/afh_mpmath_full_grid/full_grid_mpmath_summary.json" research/afh_default_density_xe131/output/mpmath_full_grid_summary.json

          cp "$RUNNER_TEMP/afh_four_benchmarks/figure2_four_benchmarks_AFH_GCN_JJ55_corrected.csv" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_four_benchmarks/figure2_four_benchmarks_AFH_GCN_JJ55_wide_audit.csv" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_four_benchmarks/selected_response_ratios.csv" research/afh_default_density_xe131/output/
          cp "$RUNNER_TEMP/afh_four_benchmarks/metadata.json" research/afh_default_density_xe131/output/four_benchmark_metadata.json
          cp "$RUNNER_TEMP/afh_four_benchmarks/"*.png research/afh_default_density_xe131/output/

          cp "$RUNNER_TEMP/afh_q_convention_audit/"*.csv research/afh_default_density_natural_xenon_halo/results/
          cp "$RUNNER_TEMP/afh_q_convention_audit/q_convention_audit_summary.json" research/afh_default_density_natural_xenon_halo/results/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/afh_default_density_xe131/output
          git add research/afh_default_density_natural_xenon_halo/results/natural_xenon_q_convention_audit.csv
          git add research/afh_default_density_natural_xenon_halo/results/xe131_afh_response_shift_NR_vs_exact.csv
          git add research/afh_default_density_natural_xenon_halo/results/xe131_fixed_benchmark_q_comparison.csv
          git add research/afh_default_density_natural_xenon_halo/results/q_convention_audit_summary.json
          if git diff --cached --quiet; then
            echo "No generated AFH outputs changed."
            exit 0
          fi
          git commit -m "data: archive exact-spatial AFH response and benchmark outputs [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

