name: AFH, Eq. (6), and natural-xenon validation (read-only)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/afh-default-xe131.yml
      - research/afh_default_density_xe131/**
      - research/afh_default_density_natural_xenon_halo/**
      - research/figure2_full_reproduction/eq6_kernel.py
      - research/figure2_full_reproduction/phase_space_convergence.py
      - research/figure2_full_reproduction/tests/**
      - research/docs/supplements/validate_figure2_manifest.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/afh-default-xe131.yml
      - research/afh_default_density_xe131/**
      - research/afh_default_density_natural_xenon_halo/**
      - research/figure2_full_reproduction/eq6_kernel.py
      - research/figure2_full_reproduction/phase_space_convergence.py
      - research/figure2_full_reproduction/tests/**
      - research/docs/supplements/validate_figure2_manifest.py

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/afh_default_density_xe131/requirements.txt

      - name: Compile Python implementations and comparators
        run: |
          python -m py_compile research/figure2_full_reproduction/eq6_kernel.py
          python -m py_compile research/figure2_full_reproduction/phase_space_convergence.py
          python -m py_compile research/afh_default_density_xe131/compare_afh_mathematica_python.py
          python -m py_compile research/afh_default_density_xe131/compare_full_dsigma_mathematica.py
          python -m py_compile research/afh_default_density_natural_xenon_halo/run_afh_natural_xenon_halo_fold.py

      - name: Run Xe-131 AFH and three-body regression tests
        run: |
          python -m unittest discover -s research/afh_default_density_xe131 -p 'test_*.py' -v
          python -m unittest discover -s research/figure2_full_reproduction/tests -p 'test_eq6_kernel.py' -v
          python -m unittest discover -s research/figure2_full_reproduction/tests -p 'test_phase_space_convergence.py' -v

      - name: Run natural-xenon target and archived-data checks
        run: |
          python -m unittest discover -s research/afh_default_density_natural_xenon_halo -p 'test_*.py' -v
          python research/afh_default_density_natural_xenon_halo/validate_archived_results.py

      - name: Validate Figure 2 source/output manifest
        run: python research/docs/supplements/validate_figure2_manifest.py

      - name: Remove Python bytecode caches created by tests
        run: find research -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify no generated calculation outputs are being committed by CI
        run: |
          git status --short
          test -z "$(git status --porcelain)"
