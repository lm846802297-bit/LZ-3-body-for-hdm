name: Finite nucleon form factors B baseline

on:
  pull_request:
    paths:
      - "research/nucleon_form_factor_B_baseline/**"
      - ".github/workflows/nucleon-form-factor-B-baseline.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed halo/seven-isotope workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  nucleon-form-factor-B:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy
      - name: Run B-baseline regression tests
        run: python -m unittest discover -s research/nucleon_form_factor_B_baseline -v
      - name: Apply B to the committed absolute AFH-7/Hybrid-9 spectra and fold through LZ efficiency
        run: |
          set -euo pipefail
          source_dir="research/afh_default_density_natural_xenon_halo/results/afh7_hybrid9_continuous_2026-11-14"
          efficiency_csv="research/lz_detector_response/lz_2026_extended_nr/lz_2026_nr_efficiency_digitized.csv"
          for model in sufian2017_unit_current alexandrou2020_charge_weighted_converted alexandrou2026_continuum_unit_current; do
            python research/nucleon_form_factor_B_baseline/apply_B_to_afh_hybrid9_continuous_spectrum.py \
              --source-dir "$source_dir" \
              --out-dir "artifacts/B-absolute/$model" \
              --strange-model "$model" --draws 3000
            python research/three_body_calculation_and_validation/fold_lz_2026_afh_hybrid9_rate_level.py \
              --spectrum-csv "artifacts/B-absolute/$model/afh_hybrid9_B_natural_xenon_spectrum.csv" \
              --spectrum-metadata "artifacts/B-absolute/$model/metadata.json" \
              --efficiency-csv "$efficiency_csv" \
              --out-dir "artifacts/B-detector/$model" \
              --exposure-tonne-year 2.84 --integration-steps 10000
          done
      - name: Download halo/seven-isotope source artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: halo-seven-isotope-full-vs-ID-full-recoil-scan
          run-id: ${{ github.event.inputs.source_run_id || '44560087038' }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/source
      - name: Apply B to baseline halo scan
        run: |
          python research/nucleon_form_factor_B_baseline/apply_nucleon_form_factors_B.py \
            --input-dir artifacts/source/halo-seven-isotope-baseline \
            --out-dir artifacts/B-baseline --draws 3000
      - name: Apply B to higher-order halo scan
        run: |
          python research/nucleon_form_factor_B_baseline/apply_nucleon_form_factors_B.py \
            --input-dir artifacts/source/halo-seven-isotope-highorder \
            --out-dir artifacts/B-highorder --draws 3000
      - name: Compare B quadrature convergence
        run: |
          for model in sufian2017_unit_current alexandrou2020_charge_weighted_converted alexandrou2026_continuum_unit_current; do
            python research/nucleon_form_factor_B_baseline/compare_B_quadrature.py \
              --baseline-dir artifacts/B-baseline/$model \
              --highorder-dir artifacts/B-highorder/$model \
              --out-dir artifacts/B-quadrature-comparison/$model
          done
      - name: Upload B-baseline numerical outputs
        uses: actions/upload-artifact@v4
        with:
          name: finite-nucleon-form-factor-B-baseline
          path: artifacts/B-*/
          if-no-files-found: error
          retention-days: 90
