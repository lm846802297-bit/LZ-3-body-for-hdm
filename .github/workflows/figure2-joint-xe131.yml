name: Figure 2 Xe-131 and natural-xenon joint response / three-body calculation

on:
  workflow_dispatch:
  push:
    branches:
      - research/figure2-p0-4-mainline
    paths:
      - .github/workflows/figure2-joint-xe131.yml
      - research/figure2_full_reproduction/joint_xe131.py
      - research/figure2_full_reproduction/eq6_kernel.py
      - research/figure2_full_reproduction/run_joint_xe131.py
      - research/figure2_full_reproduction/compare_joint_xe131_convergence.py
      - research/figure2_full_reproduction/run_natural_xenon_joint.py
      - research/figure2_full_reproduction/run_natural_xenon_halo_fold.py
      - research/figure2_full_reproduction/tests/test_joint_xe131.py
      - research/figure2_full_reproduction/tests/test_eq6_kernel.py
      - research/figure2_full_reproduction/tests/test_natural_xenon_joint.py
      - research/figure2_full_reproduction/tests/test_natural_xenon_halo_fold.py
      - "research/figure2_full_reproduction/results/anand_wm_response/xe*_GCN_WM.csv"
      - "research/figure2_full_reproduction/results/anand_wm_response/xe*_JJ55_WM.csv"

permissions:
  contents: write

jobs:
  joint-xe131-and-natural-xenon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Run all Figure 2 numerical unit tests
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_*.py' -v

      - name: Compute coarse Xe-131 joint diagnostics
        run: |
          python research/figure2_full_reproduction/run_joint_xe131.py \
            --response-dir research/figure2_full_reproduction/results/anand_wm_response \
            --out-dir /tmp/joint_xe131/coarse \
            --A 131 \
            --mchi-GeV 1000 \
            --ms-MeV 0.3 \
            --delta-m-MeV 1 \
            --speed-km-s 776 \
            --coupling-product-sq 1e-8 \
            --ER-keV 101 200 267 542 \
            --width-scheme zero \
            --nw 16 --nz 16 --nphi 8

      - name: Compute medium-order Xe-131 joint diagnostics
        run: |
          python research/figure2_full_reproduction/run_joint_xe131.py \
            --response-dir research/figure2_full_reproduction/results/anand_wm_response \
            --out-dir /tmp/joint_xe131/medium \
            --A 131 \
            --mchi-GeV 1000 \
            --ms-MeV 0.3 \
            --delta-m-MeV 1 \
            --speed-km-s 776 \
            --coupling-product-sq 1e-8 \
            --ER-keV 101 200 267 542 \
            --width-scheme zero \
            --nw 24 --nz 24 --nphi 16

      - name: Compute high-order Xe-131 joint diagnostics
        run: |
          python research/figure2_full_reproduction/run_joint_xe131.py \
            --response-dir research/figure2_full_reproduction/results/anand_wm_response \
            --out-dir /tmp/joint_xe131/fine \
            --A 131 \
            --mchi-GeV 1000 \
            --ms-MeV 0.3 \
            --delta-m-MeV 1 \
            --speed-km-s 776 \
            --coupling-product-sq 1e-8 \
            --ER-keV 101 200 267 542 \
            --width-scheme zero \
            --nw 40 --nz 32 --nphi 20

      - name: Compare Xe-131 quadrature convergence and GCN/JJ55 closure
        run: |
          python research/figure2_full_reproduction/compare_joint_xe131_convergence.py \
            --results-dir /tmp/joint_xe131

      - name: Compute isotope-specific natural-xenon contributions
        run: |
          python research/figure2_full_reproduction/run_natural_xenon_joint.py \
            --response-dir research/figure2_full_reproduction/results/anand_wm_response \
            --out-dir /tmp/natural_xenon_joint \
            --mchi-GeV 1000 \
            --ms-MeV 0.3 \
            --delta-m-MeV 1 \
            --speed-km-s 776 \
            --coupling-product-sq 1e-8 \
            --ER-keV 101 200 267 542 \
            --mV-scan-GeV 0.05 0.1 0.2 0.5 1.0 \
            --nw 40 --nz 32 --nphi 20

      - name: Halo-fold natural-xenon three-body rate
        run: |
          python research/figure2_full_reproduction/run_natural_xenon_halo_fold.py \
            --response-dir research/figure2_full_reproduction/results/anand_wm_response \
            --out-dir /tmp/natural_xenon_halo_fold \
            --mchi-GeV 1000 \
            --ms-MeV 0.3 \
            --delta-m-MeV 1 \
            --coupling-product-sq 1e-8 \
            --rhoDM-GeV-cm3 0.3 \
            --ER-keV 101 200 267 542 \
            --mV-scan-GeV 0.05 0.1 0.2 0.5 1.0 \
            --halo-models mb_untruncated shm_cutoff \
            --v0-km-s 220 \
            --ve-km-s 232 \
            --vesc-km-s 544 \
            --untruncated-vmax-km-s 1600 \
            --nv-orders 16 32 \
            --nw 16 --nz 16 --nphi 8 \
            --max-relative-convergence 5e-3

      - name: Upload halo-folded natural-xenon rate archive
        uses: actions/upload-artifact@v4
        with:
          name: natural-xenon-halo-folded-threebody-rates
          path: /tmp/natural_xenon_halo_fold/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Xe-131 joint calculation and convergence archive
        uses: actions/upload-artifact@v4
        with:
          name: xe131-joint-response-threebody-convergence
          path: /tmp/joint_xe131/
          if-no-files-found: error
          retention-days: 90

      - name: Upload natural-xenon isotope-specific archive
        uses: actions/upload-artifact@v4
        with:
          name: natural-xenon-isotope-threebody-contributions
          path: /tmp/natural_xenon_joint/
          if-no-files-found: error
          retention-days: 90

      - name: Archive joint results on the research branch
        run: |
          mkdir -p research/figure2_full_reproduction/results/joint_xe131
          mkdir -p research/figure2_full_reproduction/results/natural_xenon_joint
          mkdir -p research/figure2_full_reproduction/results/natural_xenon_halo_fold
          rm -f research/figure2_full_reproduction/results/joint_xe131/xe131_*_joint_single_speed.csv
          rm -f research/figure2_full_reproduction/results/joint_xe131/metadata.json
          cp -r /tmp/joint_xe131/* research/figure2_full_reproduction/results/joint_xe131/
          cp -r /tmp/natural_xenon_joint/* research/figure2_full_reproduction/results/natural_xenon_joint/
          cp -r /tmp/natural_xenon_halo_fold/* research/figure2_full_reproduction/results/natural_xenon_halo_fold/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/figure2_full_reproduction/results/joint_xe131
          git add research/figure2_full_reproduction/results/natural_xenon_joint
          git add research/figure2_full_reproduction/results/natural_xenon_halo_fold
          if ! git diff --cached --quiet; then
            git commit -m "Archive isotope-specific natural xenon three-body contributions"
            git push
          fi
