name: Natural xenon Earth-speed sensitivity at 101 keV

on:
  workflow_dispatch:
  push:
    branches:
      - research/figure2-p0-4-mainline
    paths:
      - .github/workflows/figure2-earth-speed-sensitivity.yml
      - research/figure2_full_reproduction/run_natural_xenon_earth_speed_scan.py
      - research/figure2_full_reproduction/run_natural_xenon_halo_fold.py
      - research/figure2_full_reproduction/isotope_mass_schemes.py
      - research/figure2_full_reproduction/tests/test_natural_xenon_earth_speed_scan.py
      - "research/figure2_full_reproduction/results/anand_wm_response/xe*_GCN_WM.csv"
      - "research/figure2_full_reproduction/results/anand_wm_response/xe*_JJ55_WM.csv"

permissions:
  contents: write

jobs:
  earth-speed-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/figure2-p0-4-mainline
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Test Earth-speed threshold classification
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_natural_xenon_earth_speed_scan.py' -v

      - name: Compute NIST-mass Earth-speed sensitivity
        run: |
          python research/figure2_full_reproduction/run_natural_xenon_earth_speed_scan.py \
            --response-dir research/figure2_full_reproduction/results/anand_wm_response \
            --out-dir /tmp/natural_xenon_earth_speed_scan \
            --mchi-GeV 1000 \
            --ms-MeV 0.3 \
            --delta-m-MeV 1 \
            --coupling-product-sq 1e-8 \
            --rhoDM-GeV-cm3 0.3 \
            --mV-GeV 0.1 \
            --ve-values-km-s 217 232 247 \
            --v0-km-s 220 \
            --vesc-km-s 544 \
            --nv-orders 16 32 \
            --nw 16 --nz 16 --nphi 8 \
            --max-relative-convergence 5e-3

      - name: Upload Earth-speed sensitivity archive
        uses: actions/upload-artifact@v4
        with:
          name: natural-xenon-earth-speed-sensitivity-101keV
          path: /tmp/natural_xenon_earth_speed_scan/
          if-no-files-found: error
          retention-days: 90

      - name: Archive Earth-speed sensitivity and rebase before pushing
        run: |
          rm -rf research/figure2_full_reproduction/results/natural_xenon_earth_speed_scan
          mkdir -p research/figure2_full_reproduction/results/natural_xenon_earth_speed_scan
          cp -r /tmp/natural_xenon_earth_speed_scan/* research/figure2_full_reproduction/results/natural_xenon_earth_speed_scan/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/figure2_full_reproduction/results/natural_xenon_earth_speed_scan
          git commit -m "Archive natural-xenon Earth-speed sensitivity at 101 keV"
          git fetch origin research/figure2-p0-4-mainline
          git rebase origin/research/figure2-p0-4-mainline
          git push origin HEAD:research/figure2-p0-4-mainline
