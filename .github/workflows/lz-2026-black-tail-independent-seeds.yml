name: LZ 2026 EFT2024 and Table S5 black-tail independent-seed response audit

on:
  push:
    branches:
      - integration/lz-2026-nest-nr-fullband-20261115
    paths:
      - research/lz_detector_response/cpp/lz_2026_nr_stratified_energy_response.cc
      - research/lz_detector_response/compare_lz_2026_nr_high_energy_half_kev.py
      - research/lz_detector_response/audit_lz_2026_black_tail_independent_seeds.py
      - research/lz_detector_response/tests/test_lz_2026_black_tail_independent_seeds.py
      - .github/workflows/lz-2026-black-tail-independent-seeds.yml
      - research/figure2_full_reproduction/results/natural_xenon_continuous_spectrum/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-seed-black-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Check out pinned NEST source
        uses: actions/checkout@v4
        with:
          repository: NESTCollaboration/nest
          ref: 541b6430dae6ea289cf110c99f174a9187f7fdee
          path: nest
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test independent-seed summary statistics
        run: |
          python -m unittest \
            research.lz_detector_response.tests.test_lz_2026_black_tail_independent_seeds \
            research.lz_detector_response.tests.test_lz_2026_nr_high_energy_half_kev -v

      - name: Build pinned NEST core
        run: |
          cmake -S nest -B nest/build \
            -DBUILD_EXAMPLES=OFF -DBUILD_GARFIELD=OFF -DBUILD_ROOT=OFF -DG4=OFF
          cmake --build nest/build --target NESTCore --parallel 2

      - name: Compile stratified NR response driver
        run: |
          g++ -std=c++17 -O2 \
            -Inest/include -Inest/include/Detectors \
            -Inest/build/_deps/gcem-src/include \
            research/lz_detector_response/cpp/lz_2026_nr_stratified_energy_response.cc \
            nest/build/libNESTCore.a -o lz_2026_nr_stratified_energy_response

      - name: Generate three independent 1-keV productions per response family
        run: |
          for family in eft2024 tableS5; do
            for seed in 20261120 20261122 20261124; do
              mkdir -p independent-seed-output/coarse/$family/seed_$seed
              ./lz_2026_nr_stratified_energy_response \
                $family 10000 $seed 225.4 269.9 1.0 \
                > independent-seed-output/coarse/$family/seed_$seed/$family.csv
            done
          done

      - name: Generate three independent 0.5-keV productions per response family
        run: |
          for family in eft2024 tableS5; do
            for seed in 20261121 20261123 20261125; do
              mkdir -p independent-seed-output/fine/$family/seed_$seed
              ./lz_2026_nr_stratified_energy_response \
                $family 10000 $seed 225.4 269.9 0.5 \
                > independent-seed-output/fine/$family/seed_$seed/$family.csv
            done
          done

      - name: Compare independent-seed rates and 2D shapes for both families
        run: |
          for family in eft2024 tableS5; do
            python research/lz_detector_response/audit_lz_2026_black_tail_independent_seeds.py \
              --response-family $family \
              --coarse-response-dirs \
                independent-seed-output/coarse/$family/seed_20261120 \
                independent-seed-output/coarse/$family/seed_20261122 \
                independent-seed-output/coarse/$family/seed_20261124 \
              --fine-response-dirs \
                independent-seed-output/fine/$family/seed_20261121 \
                independent-seed-output/fine/$family/seed_20261123 \
                independent-seed-output/fine/$family/seed_20261125 \
              --coarse-seeds 20261120 20261122 20261124 \
              --fine-seeds 20261121 20261123 20261125 \
              --events-per-stratum 10000 \
              --nuclear-models GCN JJ55 \
              --out-dir independent-seed-output/summary/$family
            cat independent-seed-output/summary/$family/black_tail_independent_seed_summary.json
          done

      - name: Upload paired-family independent-seed response samples and audits
        uses: actions/upload-artifact@v4
        with:
          name: lz-2026-black-tail-independent-seeds-eft2024-tableS5
          path: independent-seed-output/
          if-no-files-found: error
          retention-days: 60
