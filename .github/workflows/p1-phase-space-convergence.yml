name: P1 phase-space convergence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/p1-phase-space-convergence.yml
      - research/three_body_calculation_and_validation/rate_kinematics.py
      - research/three_body_calculation_and_validation/tests/test_rate_kinematics.py
      - research/three_body_calculation_and_validation/phase_space_convergence.py
      - research/three_body_calculation_and_validation/compare_phase_space_archive.py
      - research/three_body_calculation_and_validation/tests/test_phase_space_archive_comparison.py
      - research/three_body_calculation_and_validation/eq6_kernel.py
      - research/three_body_calculation_and_validation/tests/test_phase_space_convergence.py
      - research/three_body_calculation_and_validation/tests/test_eq6_kernel.py
      - research/three_body_calculation_and_validation/results/phase_space_mapping_convergence.csv
      - research/three_body_calculation_and_validation/results/phase_space_angular_convergence.csv
      - research/three_body_calculation_and_validation/results/phase_space_threshold_convergence.csv
      - research/three_body_calculation_and_validation/results/phase_space_li_prefactor_crosscheck.csv
      - research/three_body_calculation_and_validation/results/phase_space_historical_800_anchor.csv
  push:
    branches:
      - integration/lz-2026-nest-nr-fullband-20261115
    paths:
      - .github/workflows/p1-phase-space-convergence.yml
      - research/three_body_calculation_and_validation/rate_kinematics.py
      - research/three_body_calculation_and_validation/tests/test_rate_kinematics.py
      - research/three_body_calculation_and_validation/phase_space_convergence.py
      - research/three_body_calculation_and_validation/compare_phase_space_archive.py
      - research/three_body_calculation_and_validation/tests/test_phase_space_archive_comparison.py
      - research/three_body_calculation_and_validation/eq6_kernel.py
      - research/three_body_calculation_and_validation/tests/test_phase_space_convergence.py
      - research/three_body_calculation_and_validation/tests/test_eq6_kernel.py
      - research/three_body_calculation_and_validation/results/phase_space_mapping_convergence.csv
      - research/three_body_calculation_and_validation/results/phase_space_angular_convergence.csv
      - research/three_body_calculation_and_validation/results/phase_space_threshold_convergence.csv
      - research/three_body_calculation_and_validation/results/phase_space_li_prefactor_crosscheck.csv
      - research/three_body_calculation_and_validation/results/phase_space_historical_800_anchor.csv
  workflow_dispatch:

concurrency:
  group: p1-phase-space-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-space-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Compile audit and tests
        run: |
          python -m py_compile research/three_body_calculation_and_validation/rate_kinematics.py
          python -m py_compile research/three_body_calculation_and_validation/tests/test_rate_kinematics.py
          python -m py_compile research/three_body_calculation_and_validation/phase_space_convergence.py
          python -m py_compile research/three_body_calculation_and_validation/compare_phase_space_archive.py
          python -m py_compile research/three_body_calculation_and_validation/tests/test_phase_space_archive_comparison.py
          python -m py_compile research/three_body_calculation_and_validation/tests/test_phase_space_convergence.py
      - name: Run P1 phase-space regression tests
        run: |
          python -m unittest discover \
            -s research/three_body_calculation_and_validation/tests \
            -p 'test_eq6_kernel.py' -v
          python -m unittest discover \
            -s research/three_body_calculation_and_validation/tests \
            -p 'test_phase_space_convergence.py' -v
          python -m unittest discover \
            -s research/three_body_calculation_and_validation/tests \
            -p 'test_phase_space_archive_comparison.py' -v
          python -m unittest discover \
            -s research/three_body_calculation_and_validation/tests \
            -p 'test_rate_kinematics.py' -v
      - name: Reproduce benchmark, threshold, historical 800 km/s and off-shell near-pole scans
        run: |
          python research/three_body_calculation_and_validation/phase_space_convergence.py \
            --output-dir /tmp/p1_phase_space_reproduction \
            --reference-order 48 --mode all
      - name: Preserve independent reproduction outputs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-phase-space-reproduction
          path: /tmp/p1_phase_space_reproduction/
          if-no-files-found: error
          retention-days: 14

      - name: Compare fresh CSV outputs with the committed audit archive
        run: |
          python research/three_body_calculation_and_validation/compare_phase_space_archive.py \
            --reference-dir research/three_body_calculation_and_validation/results \
            --fresh-dir /tmp/p1_phase_space_reproduction \
            --relative-tolerance 5e-8
