name: P1 phase-space convergence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-space-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy
      - name: Compile audit and tests
        run: |
          python -m py_compile research/figure2_full_reproduction/phase_space_convergence.py
          python -m py_compile research/figure2_full_reproduction/compare_phase_space_archive.py
          python -m py_compile research/figure2_full_reproduction/tests/test_phase_space_convergence.py
          python -m py_compile research/figure2_full_reproduction/tests/test_phase_space_archive_comparison.py
      - name: Run P1 phase-space regression tests
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_eq6_kernel.py' -v
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_phase_space_convergence.py' -v
          python -m unittest discover -s research/figure2_full_reproduction/tests -p 'test_phase_space_archive_comparison.py' -v
      - name: Reproduce benchmark, threshold, historical 800 km/s and off-shell near-pole scans
        run: |
          python research/figure2_full_reproduction/phase_space_convergence.py \
            --output-dir /tmp/p1_phase_space_reproduction \
            --reference-order 48 --mode all
      - name: Preserve independent reproduction outputs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-phase-space-reproduction
          path: /tmp/p1_phase_space_reproduction/
          if-no-files-found: error
          retention-days: 14

      - name: Compare fresh CSV outputs with the committed audit archive
        run: python research/figure2_full_reproduction/compare_phase_space_archive.py --reference-dir research/figure2_full_reproduction/results --fresh-dir /tmp/p1_phase_space_reproduction --relative-tolerance 5e-8
