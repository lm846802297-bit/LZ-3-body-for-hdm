name: Xe-131 historical I6 mapping and quadrature closure

on:
  push:
    branches:
      - integration/lz-2026-nest-nr-fullband-20261115
    paths:
      - research/afh_default_density_xe131/audit/audit_historical_i6_mapping.py
      - .github/workflows/xe131-historical-i6-mapping-closure.yml
      - research/three_body_calculation_and_validation/eq6_kernel.py
      - research/three_body_calculation_and_validation/phase_space_convergence.py
      - research/three_body_calculation_and_validation/results/joint_xe131/fine/xe131_gcn_joint_single_speed.csv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-i6-mapping-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/afh_default_density_xe131/requirements.txt

      - name: Compile audit and kernel modules
        run: |
          python -m py_compile research/afh_default_density_xe131/audit/audit_historical_i6_mapping.py
          python -m py_compile research/three_body_calculation_and_validation/eq6_kernel.py
          python -m py_compile research/three_body_calculation_and_validation/phase_space_convergence.py

      - name: Compare archived I6 with legacy and stable mappings
        run: |
          python research/afh_default_density_xe131/audit/audit_historical_i6_mapping.py \
            --out-dir "$RUNNER_TEMP/xe131_historical_i6_mapping"

      - name: Validate coverage and non-negative finite quadrature results
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"xe131_historical_i6_mapping"
          meta=json.loads((out/"xe131_historical_i6_mapping_metadata.json").read_text())
          rows=list(csv.DictReader((out/"xe131_historical_i6_mapping_comparison.csv").open()))
          assert meta["status"]=="DIAGNOSTIC_COMPLETE"
          assert [float(r["ER_keV"]) for r in rows]==[101.0,200.0,267.0,542.0]
          assert [float(x) for x in meta["open_energy_points_keV"]]==[200.0,267.0,542.0]
          for row in rows:
              for key,value in row.items():
                  if key.endswith("_GeV2") or key.endswith("_relative_difference"):
                      number=float(value)
                      assert math.isfinite(number) and number>=0.0, (key,number)
              if int(row["current_phase_space_open"]):
                  for key in (
                      "legacy_eq6_linear_w2_40x32x20_GeV2",
                      "psc_linear_w2_40x32x20_GeV2",
                      "psc_threshold_u2_40x32x20_GeV2",
                      "psc_linear_w_40x32x20_GeV2",
                      "psc_sine2_40x32x20_GeV2",
                      "psc_threshold_u2_48x40x24_GeV2",
                      "psc_threshold_u2_64x48x32_GeV2",
                  ):
                      assert float(row[key])>0.0, (row["ER_keV"],key)
              else:
                  assert float(row["archived_I6_GeV2"])==0.0
          print("Validated the four historical energies and all mapping/quadrature outputs.")
          print(json.dumps(meta["max_relative_differences"],indent=2))
          PY

      - name: Hash historical mapping audit outputs
        run: |
          cd "$RUNNER_TEMP/xe131_historical_i6_mapping"
          sha256sum xe131_historical_i6_mapping_comparison.csv xe131_historical_i6_mapping_metadata.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      - name: Archive historical mapping audit outputs on the PR branch
        run: |
          set -euo pipefail
          archive="research/afh_default_density_xe131/output/historical_i6_mapping_audit"
          mkdir -p "$archive"
          cp "$RUNNER_TEMP/xe131_historical_i6_mapping/xe131_historical_i6_mapping_comparison.csv" "$archive/"
          cp "$RUNNER_TEMP/xe131_historical_i6_mapping/xe131_historical_i6_mapping_metadata.json" "$archive/"
          cat > "$archive/README.md" <<'EOF'
          # Historical Xe-131 I6 mapping audit

          Generated by [workflow run 43768639839](https://github.com/lm846802297-bit/LZ-3-body-for-hdm/actions/runs/43768639839). The audit compares the archived green Xe-131 fixed-speed, zero-width I6 values against the legacy Eq. (6) kernel and independent W2 mappings. It does not recalculate the AFH response or the full differential cross section. See [the scientific report](../HISTORICAL_I6_MAPPING_AUDIT.md).
          EOF
          (
            cd "$archive"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$archive"
          if git diff --cached --quiet; then
            echo "Historical I6 mapping archive already matches current outputs."
            exit 0
          fi
          git commit -m "Archive Xe-131 historical I6 mapping audit"
          git fetch origin integration/lz-2026-nest-nr-fullband-20261115
          git rebase origin/integration/lz-2026-nest-nr-fullband-20261115
          git push origin HEAD:integration/lz-2026-nest-nr-fullband-20261115

      - name: Upload historical I6 mapping audit
        uses: actions/upload-artifact@v4
        with:
          name: xe131-historical-i6-mapping-audit
          path: ${{ runner.temp }}/xe131_historical_i6_mapping/
          if-no-files-found: error
          retention-days: 90
