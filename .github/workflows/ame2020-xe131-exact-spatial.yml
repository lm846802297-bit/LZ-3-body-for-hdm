name: AME2020 CODATA2022 Xe-131 exact-spatial AFH comparison

on:
  push:
    branches:
      - research/ame2020-mass-exact-spatial-mainline
    paths:
      - .github/workflows/ame2020-xe131-exact-spatial.yml
      - research/figure2_full_reproduction/isotope_mass_schemes.py
      - research/figure2_full_reproduction/tests/test_isotope_mass_schemes.py
      - research/afh_default_density_xe131/run_ame2020_xe131_halo_partial.py
      - research/afh_default_density_xe131/tests/test_ame2020_xe131_halo_partial.py
      - research/afh_default_density_xe131/audit/audit_xe131_only_ame2020_hybrid.py
      - research/afh_default_density_xe131/tests/test_ame2020_hybrid_natural_xenon.py
      - research/afh_default_density_natural_xenon_halo/results/isotope_halo_contributions_compact.csv
      - research/afh_default_density_natural_xenon_halo/results/natural_xenon_halo_rates.csv
      - research/afh_default_density_xe131/output/afh_default_xe131_WM00.csv

concurrency:
  group: ame2020-xe131-exact-spatial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ame2020-xe131-exact-spatial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current mainline-based research branch
        uses: actions/checkout@v4
        with:
          ref: research/ame2020-mass-exact-spatial-mainline
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Test xenon nuclear-mass schemes
        run: |
          python -m unittest \
            research/figure2_full_reproduction/tests/test_isotope_mass_schemes.py -v

      - name: Test AFH Xe-131 partial-rate and q-convention implementation
        run: |
          python -m unittest \
            research/afh_default_density_xe131/tests/test_ame2020_xe131_halo_partial.py -v

      - name: Test Xe-131-only AME2020 hybrid natural-xenon diagnostic
        run: |
          python -m unittest \
            research/afh_default_density_xe131/tests/test_ame2020_hybrid_natural_xenon.py -v

      - name: Compute side-by-side mass and response-q comparisons
        run: |
          python research/afh_default_density_xe131/run_ame2020_xe131_halo_partial.py \
            --response-csv research/afh_default_density_xe131/output/afh_default_xe131_WM00.csv \
            --out-dir "$RUNNER_TEMP/ame2020_xe131_exact_spatial" \
            --mass-schemes A_u nist_nuclear ame2020_nuclear \
            --response-q-conventions exact_spatial nr_approx \
            --nv-orders 16 32 \
            --nw 8 --nz 8 --nphi 4 \
            --max-relative-speed-convergence 5e-3 \
            --max-relative-kernel-convergence 5e-3

      - name: Build Xe-131-only AME2020 hybrid natural-xenon diagnostic
        run: |
          python research/afh_default_density_xe131/audit/audit_xe131_only_ame2020_hybrid.py \
            --xe131-partial-rates "$RUNNER_TEMP/ame2020_xe131_exact_spatial/xe131_partial_halo_rates.csv" \
            --out-dir "$RUNNER_TEMP/ame2020_xe131_exact_spatial"

      - name: Upload numerical artifact
        uses: actions/upload-artifact@v4
        with:
          name: ame2020-xe131-exact-spatial-mass-comparison
          path: ${{ runner.temp }}/ame2020_xe131_exact_spatial/
          if-no-files-found: error
          retention-days: 90

      - name: Archive validated numerical outputs
        run: |
          DEST=research/afh_default_density_xe131/output/ame2020_exact_spatial_xe131_partial
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP"/ame2020_xe131_exact_spatial/* "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Archive AME2020 Xe-131 exact-spatial AFH comparison"
            git fetch origin research/ame2020-mass-exact-spatial-mainline
            git rebase origin/research/ame2020-mass-exact-spatial-mainline
            git push origin HEAD:research/ame2020-mass-exact-spatial-mainline
          fi
