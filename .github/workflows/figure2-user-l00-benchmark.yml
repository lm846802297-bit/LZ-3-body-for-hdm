name: Eq. (6) supplied L00 benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - research/figure2-l00-benchmark-450kev
    paths:
      - .github/workflows/figure2-user-l00-benchmark.yml
      - research/figure2_full_reproduction/README.md
      - research/figure2_full_reproduction/results/USER_L00_BENCHMARK_G1_G2_GVN_1_DELTA_M_450KEV.md
      - research/figure2_full_reproduction/eq6_kernel.py
      - research/figure2_full_reproduction/run_user_l00_benchmark.py
      - research/figure2_full_reproduction/tests/test_user_l00_benchmark.py

permissions:
  contents: read

jobs:
  l00-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: research/figure2-l00-benchmark-450kev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy

      - name: Run supplied L00 benchmark regression tests
        run: |
          python -m unittest discover \
            -s research/figure2_full_reproduction/tests \
            -p 'test_user_l00_benchmark.py' -v

      - name: Reproduce high-order benchmark archive
        run: |
          python research/figure2_full_reproduction/run_user_l00_benchmark.py \
            --nw 48 --nz 40 --nphi 24 \
            --output /tmp/user_l00_benchmark.json

      - name: Upload numerical benchmark archive
        uses: actions/upload-artifact@v4
        with:
          name: user-l00-benchmark-delta-m-450-kev
          path: /tmp/user_l00_benchmark.json
          if-no-files-found: error
          retention-days: 90
