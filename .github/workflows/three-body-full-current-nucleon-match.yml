name: Full three-body current and nucleon Dirac-Pauli contraction

on:
  pull_request:
    paths:
      - "research/three_body_full_current_nucleon_match/*.py"
      - "research/three_body_full_current_nucleon_match/**/*.py"
      - "research/three_body_spin_resolved_current/*.py"
      - "research/three_body_spin_resolved_current/**/*.py"
      - "research/vector_current_response_audit/*.py"
      - "research/vector_current_response_audit/**/*.py"
      - ".github/workflows/three-body-full-current-nucleon-match.yml"
  workflow_dispatch:
    inputs:
      run_quadrature_regression:
        description: "Run the legacy P0 quadrature regression explicitly"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: full-current-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-current:
    needs: afh-spatial-obdme
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Compile code and tests
        run: |
          python -m py_compile \
            research/three_body_full_current_nucleon_match/full_current_nucleon_match.py \
            research/three_body_full_current_nucleon_match/three_body_phase_space_tensor.py \
            research/three_body_full_current_nucleon_match/test_full_current_nucleon_match.py \
            research/three_body_full_current_nucleon_match/test_three_body_phase_space_tensor.py \
            research/three_body_full_current_nucleon_match/phase_space_tensor_convergence.py \
            research/three_body_full_current_nucleon_match/test_phase_space_tensor_convergence.py \
            research/three_body_full_current_nucleon_match/three_body_multipole_leptonic_weights.py \
            research/three_body_full_current_nucleon_match/test_three_body_multipole_leptonic_weights.py \
            research/three_body_full_current_nucleon_match/contract_three_body_afh_responses.py \
            research/three_body_full_current_nucleon_match/test_contract_three_body_afh_responses.py \
            research/three_body_full_current_nucleon_match/native_charge_sector_halo_fold.py \
            research/three_body_full_current_nucleon_match/test_native_charge_sector_halo_fold.py \
            research/three_body_full_current_nucleon_match/afh_spatial_obdme_responses.py \
            research/three_body_full_current_nucleon_match/validate_afh_spatial_multipole_archive.py \
            research/three_body_full_current_nucleon_match/test_afh_spatial_obdme_responses.py \
            research/three_body_full_current_nucleon_match/test_afh_native_multipole_comparator.py \
            research/afh_response_crosschecks/compare_p3_multipoles_vs_native.py
      - name: Run full-current regression tests
        run: |
          python -m unittest discover \
            -s research/three_body_full_current_nucleon_match \
            -p 'test_*.py' -v
      - name: Run native charge-sector engine unit tests
        run: |
          python -m unittest \
            research/three_body_full_current_nucleon_match/test_native_charge_sector_halo_fold.py -v
      - name: Generate static one-nucleon matching diagnostic
        run: |
          python research/three_body_full_current_nucleon_match/full_current_nucleon_match.py \
            --out /tmp/full-current-nucleon-match.json
      - name: Generate phase-space-integrated spin-resolved three-body tensor
        run: |
          python research/three_body_full_current_nucleon_match/three_body_phase_space_tensor.py \
            --out /tmp/three-body-phase-space-tensor.json
      - name: Extract AFH response coefficients from Eq. (107)
        run: |
          python research/three_body_full_current_nucleon_match/three_body_multipole_leptonic_weights.py \
            --input /tmp/three-body-phase-space-tensor.json \
            --out /tmp/three-body-multipole-leptonic-weights.json \
            --f1 3.0 --f2 -0.552 --mN 0.938918
      - name: Download provisional seven-isotope AFH response archive
        uses: actions/download-artifact@v4
        with:
          name: afh-v6-seven-isotope-eight-response
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 44222087512
          path: /tmp/afh-full-response
      - name: Download P3-B spatial response and multipole archive
        uses: actions/download-artifact@v4
        with:
          name: provisional-afh-spatial-obdme-responses
          path: /tmp/afh-spatial-obdme
      - name: Contract three-body coefficients with C0-consistent AFH responses
        run: |
          python research/three_body_full_current_nucleon_match/contract_three_body_afh_responses.py \
            --afh-dir /tmp/afh-full-response \
            --spatial-dir /tmp/afh-spatial-obdme \
            --weights-json /tmp/three-body-multipole-leptonic-weights.json \
            --out /tmp/three-body-afh-response-contraction.json \
            --afh-artifact-run-id 44222087512 --afh-artifact-id 14391456283 \
            --spatial-artifact-run-id ${{ github.run_id }} \
            --spatial-artifact-id ${{ needs.afh-spatial-obdme.outputs.artifact_id }}
      - name: Upload matching and integrated tensor diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: full-three-body-current-nucleon-match-and-phase-space-tensor
          path: |
            /tmp/full-current-nucleon-match.json
            /tmp/three-body-phase-space-tensor.json
            /tmp/three-body-multipole-leptonic-weights.json
            /tmp/three-body-afh-response-contraction.json
          if-no-files-found: error
          retention-days: 90


  afh-spatial-obdme:
    outputs:
      artifact_id: ${{ steps.upload_spatial.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install AFH spatial-response dependencies
        run: python -m pip install --upgrade numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Compile AFH spatial OBDME implementation and tests
        run: |
          python -m py_compile \
            research/three_body_full_current_nucleon_match/afh_spatial_obdme_responses.py \
            research/three_body_full_current_nucleon_match/test_afh_spatial_obdme_responses.py
      - name: Test selected AFH spatial OBDME points
        run: |
          python -m unittest \
            research.three_body_full_current_nucleon_match.test_afh_spatial_obdme_responses -v
      - name: Generate seven-isotope AFH spatial OBDME response grid
        run: |
          python research/three_body_full_current_nucleon_match/afh_spatial_obdme_responses.py \
            --out-dir /tmp/afh-spatial-obdme
      - name: Validate rank-resolved AFH spatial multipole archive
        run: |
          python research/three_body_full_current_nucleon_match/validate_afh_spatial_multipole_archive.py \
            --out-dir /tmp/afh-spatial-obdme \
            --out-json /tmp/afh-spatial-obdme/multipole-validation.json
      - name: Upload provisional AFH spatial OBDME grid
        id: upload_spatial
        uses: actions/upload-artifact@v4
        with:
          name: provisional-afh-spatial-obdme-responses
          path: /tmp/afh-spatial-obdme
          if-no-files-found: error
          retention-days: 90

  quadrature-convergence:
    if: github.event_name == 'workflow_dispatch' && inputs.run_quadrature_regression == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy==2.3.5
      - name: Compile convergence audit and tests
        run: |
          python -m py_compile \
            research/three_body_full_current_nucleon_match/three_body_phase_space_tensor.py \
            research/three_body_full_current_nucleon_match/phase_space_tensor_convergence.py \
            research/three_body_full_current_nucleon_match/test_phase_space_tensor_convergence.py
      - name: Test component-wise convergence metrics
        run: |
          python -m unittest discover \
            -s research/three_body_full_current_nucleon_match \
            -p 'test_phase_space_tensor_convergence.py' -v
      - name: Run all-component convergence scan
        run: |
          python research/three_body_full_current_nucleon_match/phase_space_tensor_convergence.py \
            --out /tmp/three-body-phase-space-convergence.json
      - name: Upload convergence diagnostics even when the numerical gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-body-phase-space-component-convergence
          path: /tmp/three-body-phase-space-convergence.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce medium-to-high-order convergence
        run: |
          python -c "import json; p=json.load(open('/tmp/three-body-phase-space-convergence.json')); a=p['acceptance']; print(json.dumps(a, indent=2)); raise SystemExit(0 if a['successive_high_order_pair_pass'] else 1)"
