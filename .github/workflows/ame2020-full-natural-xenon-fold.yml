name: AME2020 full natural-xenon exact-spatial halo fold

on:
  push:
    branches:
      - research/ame2020-xe131-exact-spatial-mainline
    paths:
      - .github/workflows/ame2020-full-natural-xenon-fold.yml
      - research/afh_default_density_natural_xenon_halo/run_afh_natural_xenon_halo_fold_full_response.py
      - research/afh_default_density_natural_xenon_halo/compare_full_response_mass_schemes.py
      - research/afh_default_density_natural_xenon_halo/compare_legacy_reproduction.py
      - research/afh_default_density_natural_xenon_halo/input/natural_xenon_isotope_weights.csv
      - research/afh_default_density_xenon_all_isotopes/output/afh_default_xenon_WM00.csv
      - research/afh_default_density_xenon_all_isotopes/output/metadata.json
      - research/figure2_full_reproduction/isotope_mass_schemes.py
      - research/figure2_full_reproduction/eq6_kernel.py

concurrency:
  group: ame2020-full-natural-xenon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  full-natural-xenon-halo-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the mainline-based research branch
        uses: actions/checkout@v4
        with:
          ref: research/ame2020-xe131-exact-spatial-mainline
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Recheck full AFH response-grid validation
        run: |
          python -m unittest \
            research/afh_default_density_xenon_all_isotopes/test_afh_default_xenon_responses.py -v

      - name: Compute NIST-mass exact-spatial full natural-xenon baseline
        run: |
          python research/afh_default_density_natural_xenon_halo/run_afh_natural_xenon_halo_fold_full_response.py \
            --response-grid research/afh_default_density_xenon_all_isotopes/output/afh_default_xenon_WM00.csv \
            --mass-scheme nist_nuclear \
            --response-q-convention exact_spatial \
            --out-dir "$RUNNER_TEMP/nist_nuclear"

      - name: Compare NIST full-grid fold with archived 28-sample baseline
        run: |
          python research/afh_default_density_natural_xenon_halo/compare_legacy_reproduction.py \
            --reproduced-dir "$RUNNER_TEMP/nist_nuclear" \
            --relative-tolerance 5e-8

      - name: Compute AME2020 exact-spatial full natural-xenon prediction
        run: |
          python research/afh_default_density_natural_xenon_halo/run_afh_natural_xenon_halo_fold_full_response.py \
            --response-grid research/afh_default_density_xenon_all_isotopes/output/afh_default_xenon_WM00.csv \
            --mass-scheme ame2020_nuclear \
            --response-q-convention exact_spatial \
            --out-dir "$RUNNER_TEMP/ame2020_nuclear"

      - name: Compare AME2020 and NIST mass schemes
        run: |
          python research/afh_default_density_natural_xenon_halo/compare_full_response_mass_schemes.py \
            --nist-dir "$RUNNER_TEMP/nist_nuclear" \
            --ame-dir "$RUNNER_TEMP/ame2020_nuclear" \
            --out-dir "$RUNNER_TEMP/mass_scheme_comparison"

      - name: Upload complete natural-xenon calculation archive
        uses: actions/upload-artifact@v4
        with:
          name: ame2020-full-natural-xenon-exact-spatial
          path: |
            ${{ runner.temp }}/nist_nuclear/
            ${{ runner.temp }}/ame2020_nuclear/
            ${{ runner.temp }}/mass_scheme_comparison/
          if-no-files-found: error
          retention-days: 90

      - name: Archive NIST and AME2020 natural-xenon results
        shell: bash
        run: |
          set -euo pipefail
          DEST=research/afh_default_density_natural_xenon_halo/output/ame2020_full_response
          mkdir -p "$DEST/nist_nuclear" "$DEST/ame2020_nuclear" "$DEST/mass_scheme_comparison"
          cp "$RUNNER_TEMP"/nist_nuclear/* "$DEST/nist_nuclear/"
          cp "$RUNNER_TEMP"/ame2020_nuclear/* "$DEST/ame2020_nuclear/"
          cp "$RUNNER_TEMP"/mass_scheme_comparison/* "$DEST/mass_scheme_comparison/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Archive full-response AME2020 natural-xenon halo fold"
            git fetch origin research/ame2020-xe131-exact-spatial-mainline
            git rebase origin/research/ame2020-xe131-exact-spatial-mainline
            git push origin HEAD:research/ame2020-xe131-exact-spatial-mainline
          fi
