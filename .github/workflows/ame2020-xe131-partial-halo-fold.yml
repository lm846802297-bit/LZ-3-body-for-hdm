name: AME2020 CODATA2022 Xe-131 partial halo fold

on:
  push:
    branches:
      - research/ame2020-nuclear-mass-xe131-recalc
    paths:
      - .github/workflows/ame2020-xe131-partial-halo-fold.yml
      - research/figure2_full_reproduction/isotope_mass_schemes.py
      - research/figure2_full_reproduction/tests/test_isotope_mass_schemes.py
      - research/afh_default_density_xe131/run_ame2020_xe131_halo_partial.py
      - research/afh_default_density_xe131/test_ame2020_xe131_halo_partial.py
      - research/afh_default_density_xe131/output/afh_default_xe131_WM00.csv

permissions:
  contents: write

jobs:
  ame2020-xe131-partial-halo-fold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/ame2020-nuclear-mass-xe131-recalc
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Test xenon mass schemes
        run: |
          python -m unittest \
            research/figure2_full_reproduction/tests/test_isotope_mass_schemes.py -v

      - name: Test AFH Xe-131 partial-rate implementation
        run: |
          python -m unittest \
            research/afh_default_density_xe131/test_ame2020_xe131_halo_partial.py -v

      - name: Compute AME2020/CODATA2022 Xe-131 partial halo fold
        run: |
          python research/afh_default_density_xe131/run_ame2020_xe131_halo_partial.py \
            --response-csv research/afh_default_density_xe131/output/afh_default_xe131_WM00.csv \
            --out-dir "$RUNNER_TEMP/ame2020_xe131_partial" \
            --nv-orders 16 32 \
            --nw 8 --nz 8 --nphi 4 \
            --max-relative-speed-convergence 5e-3 \
            --max-relative-kernel-convergence 5e-3

      - name: Upload numerical artifact
        uses: actions/upload-artifact@v4
        with:
          name: ame2020-codata2022-xe131-partial-halo-fold
          path: \${{ runner.temp }}/ame2020_xe131_partial/
          if-no-files-found: error
          retention-days: 90

      - name: Archive validated results in the research branch
        run: |
          DEST=research/afh_default_density_xe131/output/ame2020_cod2022_xe131_partial
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP"/ame2020_xe131_partial/* "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Archive AME2020 CODATA2022 Xe-131 partial halo fold"
            git fetch origin research/ame2020-nuclear-mass-xe131-recalc
            git rebase origin/research/ame2020-nuclear-mass-xe131-recalc
            git push origin HEAD:research/ame2020-nuclear-mass-xe131-recalc
          fi
