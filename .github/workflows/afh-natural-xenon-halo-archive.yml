name: AFH natural-xenon halo-fold archive validation

on:
  pull_request:
    paths:
      - .github/workflows/afh-natural-xenon-halo-archive.yml
      - research/afh_default_density_natural_xenon_halo/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-afh-natural-xenon-halo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate isotope contributions, rate sums and quadrature records
        run: python research/afh_default_density_natural_xenon_halo/validate_archived_results.py
