name: LZ structured result archive validation

on:
  pull_request:
    paths:
      - .github/workflows/lz-structured-result-archive-validation.yml
      - research/result_archive.py
      - research/schemas/**
      - research/afh_default_density_natural_xenon_halo/run_afh7_hybrid9_continuous_spectrum.py
      - research/afh_default_density_natural_xenon_halo/run_afh_default_xenon_responses.py
      - research/afh_default_density_natural_xenon_halo/tests/test_result_archive.py
      - research/three_body_calculation_and_validation/phase_space_convergence.py
      - research/three_body_calculation_and_validation/tests/test_phase_space_convergence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test and schema dependencies
        run: |
          python -m pip install numpy scipy
          python -m pip install -r research/schemas/requirements-result-validation.txt
      - name: Compile archive-wired calculation entry points
        run: |
          python -m py_compile research/result_archive.py
          python -m py_compile research/afh_default_density_natural_xenon_halo/run_afh7_hybrid9_continuous_spectrum.py
          python -m py_compile research/afh_default_density_natural_xenon_halo/run_afh_default_xenon_responses.py
          python -m py_compile research/three_body_calculation_and_validation/phase_space_convergence.py
      - name: Validate structured archive writer against frozen AFH outputs
        run: python -m unittest -v research/afh_default_density_natural_xenon_halo/tests/test_result_archive.py
      - name: Run AFH-7/Hybrid-9 regression tests
        run: python -m unittest -v research/afh_default_density_natural_xenon_halo/tests/test_afh7_hybrid9_continuous_spectrum.py
      - name: Run independent Eq. (6) phase-space tests
        run: python -m unittest -v research/three_body_calculation_and_validation/tests/test_phase_space_convergence.py
