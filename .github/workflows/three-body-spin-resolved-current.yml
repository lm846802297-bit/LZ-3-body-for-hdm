name: Finite-width spin current and recoil spectrum

on:
  push:
    branches:
      - research/three-body-spin-resolved-current-20261118
  pull_request:
    paths:
      - "research/three_body_spin_resolved_current/**"
      - "research/vector_current_response_audit/**"
      - "research/three_body_calculation_and_validation/eq6_kernel.py"
      - ".github/workflows/three-body-spin-resolved-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-width-current-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy==2.3.5
      - name: Compile calculation and tests
        run: |
          python -m py_compile \
            research/three_body_spin_resolved_current/spin_resolved_three_body_current.py \
            research/three_body_spin_resolved_current/recoil_spectrum_width_scan.py \
            research/three_body_spin_resolved_current/test_spin_resolved_three_body_current.py \
            research/three_body_spin_resolved_current/test_recoil_spectrum_width_scan.py
      - name: Run Ward and spectrum regression tests
        run: |
          python -m unittest discover \
            -s research/three_body_spin_resolved_current \
            -p 'test_*.py' -v
      - name: Generate finite-width recoil spectrum scan
        run: |
          python research/three_body_spin_resolved_current/recoil_spectrum_width_scan.py \
            --outdir /tmp/finite-width-recoil-spectrum
      - name: Generate spin-resolved Ward diagnostic
        run: |
          python research/three_body_spin_resolved_current/spin_resolved_three_body_current.py \
            --out /tmp/finite-width-recoil-spectrum/spin_resolved_ward.json
      - name: Upload spectrum and Ward evidence
        uses: actions/upload-artifact@v4
        with:
          name: finite-width-spin-current-recoil-spectrum
          path: /tmp/finite-width-recoil-spectrum/
          if-no-files-found: error
          retention-days: 30
