name: Three-body full integral vs I(D), halo and seven isotopes

on:
  pull_request:
    paths:
      - "research/three_body_phase_space_ID_validation/**"
      - "research/three_body_calculation_and_validation/eq6_kernel.py"
      - "research/afh_default_density_natural_xenon_halo/**"
      - ".github/workflows/three-body-halo-ID-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  halo-seven-isotope-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy sympy
      - name: Run regression tests
        run: python -m unittest research.three_body_phase_space_ID_validation.test_halo_seven_isotope_ID -v
      - name: Run halo-folded comparison
        run: |
          python research/three_body_phase_space_ID_validation/validate_halo_seven_isotope_ID.py \
            --er-min-keV 180 --er-max-keV 320 --er-step-keV 10 \
            --speed-order 24 --nw 8 --nz 8 --nphi 4 \
            --outdir artifacts/halo-seven-isotope
      - name: Run higher-order quadrature cross-check
        run: |
          python research/three_body_phase_space_ID_validation/validate_halo_seven_isotope_ID.py \
            --er-min-keV 180 --er-max-keV 320 --er-step-keV 10 \
            --speed-order 32 --nw 10 --nz 10 --nphi 6 \
            --outdir artifacts/halo-seven-isotope-highorder
      - name: Compare baseline and higher-order quadrature
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          base = pd.read_csv("artifacts/halo-seven-isotope/natural_xenon_halo_comparison.csv")
          high = pd.read_csv("artifacts/halo-seven-isotope-highorder/natural_xenon_halo_comparison.csv")
          merged = base.merge(high, on="ER_keV", suffixes=("_base", "_high"), validate="one_to_one")
          merged["full_rate_quadrature_shift_pct"] = (merged.natural_xenon_full_relative_rate_high / merged.natural_xenon_full_relative_rate_base - 1.0) * 100.0
          merged["I_D_rate_quadrature_shift_pct"] = (merged.natural_xenon_I_D_relative_rate_high / merged.natural_xenon_I_D_relative_rate_base - 1.0) * 100.0
          merged["approximation_error_shift_pp"] = merged.relative_error_pct_high - merged.relative_error_pct_base
          out = Path("artifacts/halo-seven-isotope-quadrature-comparison")
          out.mkdir(parents=True, exist_ok=True)
          merged.to_csv(out / "quadrature_comparison.csv", index=False)
          print("max |full-rate quadrature shift| [%] =", merged.full_rate_quadrature_shift_pct.abs().max())
          print("max |I(D)-rate quadrature shift| [%] =", merged.I_D_rate_quadrature_shift_pct.abs().max())
          print("max |approximation-error shift| [percentage points] =", merged.approximation_error_shift_pp.abs().max())
          PY
      - name: Upload numerical outputs
        uses: actions/upload-artifact@v4
        with:
          name: halo-seven-isotope-full-vs-ID
          path: artifacts/halo-seven-isotope*/
          if-no-files-found: error
          retention-days: 90
