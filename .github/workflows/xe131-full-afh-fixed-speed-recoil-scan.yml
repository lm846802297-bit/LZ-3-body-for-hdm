name: Xe-131 full AFH fixed-speed six-channel recoil scan

on:
  pull_request:
    paths:
      - "research/three_body_full_current_nucleon_match/xe131_full_afh_fixed_speed_recoil_scan.py"
      - "research/three_body_full_current_nucleon_match/test_xe131_full_afh_fixed_speed_recoil_scan.py"
      - "research/three_body_full_current_nucleon_match/audit_xe131_six_channel_interpolation.py"
      - "research/three_body_full_current_nucleon_match/test_audit_xe131_six_channel_interpolation.py"
      - "research/three_body_full_current_nucleon_match/afh_spatial_obdme_responses.py"
      - "research/three_body_full_current_nucleon_match/three_body_phase_space_tensor.py"
      - "research/three_body_full_current_nucleon_match/three_body_multipole_leptonic_weights.py"
      - "research/three_body_full_current_nucleon_match/nucleon_vector_form_factors.py"
      - "research/three_body_full_current_nucleon_match/xe131_fixed_speed_charge_dsigma.py"
      - "research/three_body_spin_resolved_current/**"
      - "research/vector_current_response_audit/**"
      - "research/afh_default_density_xe131/**"
      - "research/afh_default_density_natural_xenon_halo/results/full_afh_v6_default_7_isotope_response/**"
      - ".github/workflows/xe131-full-afh-fixed-speed-recoil-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  xe131-six-channel-recoil-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the provenance-pinned native Xe-131 charge response
        uses: actions/checkout@v4
        with:
          repository: lm846802297-bit/LZ-3-body-for-hdm
          ref: e6d9dee3527cab200ee6b21198d577b987282fac
          path: afh-native
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Compile scan and interpolation audit
        run: |
          python -m py_compile \
            research/three_body_full_current_nucleon_match/xe131_full_afh_fixed_speed_recoil_scan.py \
            research/three_body_full_current_nucleon_match/test_xe131_full_afh_fixed_speed_recoil_scan.py \
            research/three_body_full_current_nucleon_match/audit_xe131_six_channel_interpolation.py \
            research/three_body_full_current_nucleon_match/test_audit_xe131_six_channel_interpolation.py \
            research/three_body_full_current_nucleon_match/afh_spatial_obdme_responses.py \
            research/three_body_full_current_nucleon_match/three_body_phase_space_tensor.py \
            research/three_body_full_current_nucleon_match/three_body_multipole_leptonic_weights.py
      - name: Run six-channel kernel and benchmark-grid tests
        run: |
          python -m unittest discover \
            -s research/three_body_full_current_nucleon_match \
            -p 'test_xe131_full_afh_fixed_speed_recoil_scan.py' -v
      - name: Run local Chebyshev interpolation audit tests
        run: |
          python -m unittest discover \
            -s research/three_body_full_current_nucleon_match \
            -p 'test_audit_xe131_six_channel_interpolation.py' -v
      - name: Compute Xe-131 native-charge plus six-channel AFH recoil scan
        run: |
          python research/three_body_full_current_nucleon_match/xe131_full_afh_fixed_speed_recoil_scan.py \
            --native-charge-csv afh-native/research/afh_default_density_xe131/output/phi_response_native/afh_default_xe131_M_PhiPP_native.csv \
            --outdir /tmp/xe131-full-afh-recoil-scan
      - name: Audit six-channel response interpolation around the Xe-131 diffraction minimum
        run: |
          python research/three_body_full_current_nucleon_match/audit_xe131_six_channel_interpolation.py \
            --scan-csv /tmp/xe131-full-afh-recoil-scan/xe131_six_channel_fixed_speed_recoil_scan.csv \
            --response-grid-csv /tmp/xe131-full-afh-recoil-scan/xe131_six_response_grid.csv \
            --scan-json /tmp/xe131-full-afh-recoil-scan/xe131_six_channel_fixed_speed_recoil_scan.json \
            --out-csv /tmp/xe131-full-afh-recoil-scan/xe131_six_channel_interpolation_audit.csv \
            --out-json /tmp/xe131-full-afh-recoil-scan/xe131_six_channel_interpolation_audit.json
      - name: Record source, input, environment, and hardware provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path
          import numpy
          import scipy
          import sympy

          def sha256(path):
              raw = Path(path).read_bytes()
              return hashlib.sha256(raw).hexdigest()

          def canonical_sha256(path):
              raw = Path(path).read_bytes().replace(b"\r\n", b"\n")
              return hashlib.sha256(raw).hexdigest()

          def git_head(path="."):
              return subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()

          def cpu_model():
              try:
                  for line in Path("/proc/cpuinfo").read_text().splitlines():
                      if line.lower().startswith("model name"):
                          return line.split(":", 1)[1].strip()
              except OSError:
                  pass
              return platform.processor() or "unavailable"

          out = Path("/tmp/xe131-full-afh-recoil-scan")
          inputs = {
              "native_xe131_charge_csv": "afh-native/research/afh_default_density_xe131/output/phi_response_native/afh_default_xe131_M_PhiPP_native.csv",
              "native_xe131_metadata_json": "afh-native/research/afh_default_density_xe131/output/phi_response_native/afh_default_xe131_M_PhiPP_metadata.json",
              "native_xe131_validation_json": "afh-native/research/afh_default_density_xe131/output/phi_response_native/afh_default_xe131_M_PhiPP_validation.json",
              "afh_v6_source": "afh-native/v6/dmformfactor-V6.m",
              "xe131_spatial_density_matrix": "research/afh_default_density_natural_xenon_halo/results/full_afh_v6_default_7_isotope_response/density_matrices/afh_default_xe131_density_matrix.csv",
              "spatial_response_metadata": "research/afh_default_density_natural_xenon_halo/results/full_afh_v6_default_7_isotope_response/metadata.json",
          }
          sources = {
              "six_channel_scan": "research/three_body_full_current_nucleon_match/xe131_full_afh_fixed_speed_recoil_scan.py",
              "interpolation_audit": "research/three_body_full_current_nucleon_match/audit_xe131_six_channel_interpolation.py",
              "spatial_obdme": "research/three_body_full_current_nucleon_match/afh_spatial_obdme_responses.py",
              "three_body_tensor": "research/three_body_full_current_nucleon_match/three_body_phase_space_tensor.py",
              "multipole_weights": "research/three_body_full_current_nucleon_match/three_body_multipole_leptonic_weights.py",
              "nucleon_form_factors": "research/three_body_full_current_nucleon_match/nucleon_vector_form_factors.py",
          }
          lines = [
              "record=xe131_fixed_speed_six_channel_recoil_scan",
              f"github_run_id={os.environ.get('GITHUB_RUN_ID', 'unknown')}",
              f"github_run_attempt={os.environ.get('GITHUB_RUN_ATTEMPT', 'unknown')}",
              f"pull_request_head_sha={os.environ.get('PR_HEAD_SHA', 'unknown')}",
              f"checked_out_repository_sha={git_head('.')}",
              f"pinned_afh_repository_sha={git_head('afh-native')}",
              f"python={sys.version.replace(chr(10), ' ')}",
              f"numpy={numpy.__version__}",
              f"scipy={scipy.__version__}",
              f"sympy={sympy.__version__}",
              f"platform={platform.platform()}",
              f"machine={platform.machine()}",
              f"cpu_count={os.cpu_count()}",
              f"cpu_model={cpu_model()}",
          ]
          try:
              gpu = subprocess.check_output(
                  ["nvidia-smi", "--query-gpu=name,driver_version,memory.total",
                   "--format=csv,noheader"], text=True, stderr=subprocess.STDOUT
              ).strip().replace("\n", " | ")
          except Exception:
              gpu = "not exposed to this runner"
          lines.append(f"gpu={gpu}")
          for name, path in inputs.items():
              lines.append(f"input.{name}.sha256={sha256(path)}")
          lines.append(
              "input.native_xe131_charge_csv.canonical_lf_sha256="
              + canonical_sha256(inputs["native_xe131_charge_csv"])
          )
          lines.append(
              "input.native_xe131_metadata_json.canonical_lf_sha256="
              + canonical_sha256(inputs["native_xe131_metadata_json"])
          )
          lines.append(
              "input.native_xe131_validation_json.canonical_lf_sha256="
              + canonical_sha256(inputs["native_xe131_validation_json"])
          )
          for name, path in sources.items():
              lines.append(f"source.{name}.sha256={sha256(path)}")
          (out / "provenance.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Finalize and verify SHA-256 manifest for every output
        run: |
          cd /tmp/xe131-full-afh-recoil-scan
          sha256sum *.csv *.json provenance.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload response grid, pointwise kernels and interpolation audit
        uses: actions/upload-artifact@v4
        with:
          name: xe131-full-afh-six-channel-fixed-speed-recoil-scan
          path: /tmp/xe131-full-afh-recoil-scan
          if-no-files-found: error
          retention-days: 90
