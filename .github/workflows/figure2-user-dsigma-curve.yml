name: Xe131 differential cross section curve (450 keV benchmark)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade numpy scipy
      - name: Calculate fixed-speed Xe-131 d sigma / d ER
        run: |
          python research/figure2_full_reproduction/run_user_dsigma_curve.py \
            --step-keV 5 --nw 20 --nz 16 --nphi 12 \
            --output /tmp/xe131_dsigma_450keV.csv
      - uses: actions/upload-artifact@v4
        with:
          name: xe131-dsigma-450keV-v776
          path: /tmp/xe131_dsigma_450keV.csv
          if-no-files-found: error
          retention-days: 90
