name: Regenerate seven AFH default xenon response grids

on:
  workflow_dispatch:
  push:
    branches:
      - research/ame2020-mass-exact-spatial-mainline
    paths:
      - .github/workflows/ame2020-natural-xenon-afh-responses.yml
      - research/afh_default_density_natural_xenon_halo/extract_afh_xenon_default_matrices.py
      - research/afh_default_density_natural_xenon_halo/run_afh_default_xenon_responses.py
      - research/afh_default_density_natural_xenon_halo/verify_afh_selected_q_mpmath.py
      - research/figure2_full_reproduction/isotope_mass_schemes.py
      - research/afh_default_density_natural_xenon_halo/input/afh_response_samples.csv
      - research/afh_default_density_xe131/input/afh_default_xe131_density_matrix.csv
      - research/afh_default_density_xe131/output/afh_default_xe131_WM00.csv
      - research/afh_default_density_xe131/run_afh_default_xe131.py

concurrency:
  group: ame2020-natural-xenon-afh-responses-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate-afh-responses:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the AME2020 research branch
        uses: actions/checkout@v4
        with:
          ref: research/ame2020-mass-exact-spatial-mainline
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sympy mpmath

      - name: Download and verify the official AFH v6.0 source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/afh-dmformfactor-v6.zip"
          SOURCE_DIR="$RUNNER_TEMP/afh-dmformfactor-v6"
          curl --fail --location --retry 4 --retry-delay 5 \
            https://www.ocf.berkeley.edu/~nanand/software/dmformfactor/v6.zip \
            --output "$ARCHIVE"
          echo "4e0f70e6e780f3f4a40faa14792cae239d1989cf15d1e211b4fd7389b0460727  $ARCHIVE" \
            | sha256sum --check
          mkdir -p "$SOURCE_DIR"
          unzip -q "$ARCHIVE" -d "$SOURCE_DIR"
          PACKAGE="$(find "$SOURCE_DIR" -type f -name 'dmformfactor-V6.m' -print -quit)"
          test -n "$PACKAGE"
          ACTUAL="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          EXPECTED="dc0742f1c50b0a478adab62f2ddef6c82978ee034c1f177e0ed917deab5dd372"
          test "$ACTUAL" = "$EXPECTED"
          echo "AFH_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "AFH_ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Verified AFH v6.0 package: $ACTUAL"

      - name: Extract the seven AFH default xenon density matrices
        run: |
          python research/afh_default_density_natural_xenon_halo/extract_afh_xenon_default_matrices.py \
            --package "$AFH_PACKAGE" \
            --out-dir "$RUNNER_TEMP/afh_default_density_matrices" \
            --xe131-reference research/afh_default_density_xe131/input/afh_default_xe131_density_matrix.csv \
            --archive-sha256 "$AFH_ARCHIVE_SHA256"

      - name: Generate all seven 2401-node AFH response curves
        run: |
          python research/afh_default_density_natural_xenon_halo/run_afh_default_xenon_responses.py \
            --matrix-dir "$RUNNER_TEMP/afh_default_density_matrices" \
            --out-dir "$RUNNER_TEMP/afh_default_xenon_responses"

      - name: Independently validate selected exact-q AFH responses with mpmath
        run: |
          python research/afh_default_density_natural_xenon_halo/verify_afh_selected_q_mpmath.py \
            --matrix-dir "$RUNNER_TEMP/afh_default_density_matrices" \
            --response-csv "$RUNNER_TEMP/afh_default_xenon_responses/afh_xe_isotope_responses.csv" \
            --selected-samples research/afh_default_density_natural_xenon_halo/input/afh_response_samples.csv \
            --out-dir "$RUNNER_TEMP/afh_selected_q_mpmath"

      - name: Run the existing Xe-131 AME2020 regression tests
        run: |
          python -m unittest \
            research/figure2_full_reproduction/tests/test_isotope_mass_schemes.py -v
          python -m unittest \
            research/afh_default_density_xe131/tests/test_ame2020_xe131_halo_partial.py -v
          python -m unittest \
            research/afh_default_density_xe131/tests/test_ame2020_hybrid_natural_xenon.py -v

      - name: Upload response grids and regression records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afh-v6-seven-isotope-response-grids
          path: |
            ${{ runner.temp }}/afh_default_density_matrices/
            ${{ runner.temp }}/afh_default_xenon_responses/
            ${{ runner.temp }}/afh_selected_q_mpmath/
          if-no-files-found: warn
          retention-days: 90

      - name: Archive native matrices and response grids on the research branch
        shell: bash
        run: |
          set -euo pipefail
          MATRIX_DEST="research/afh_default_density_natural_xenon_halo/input/afh_default_density_matrices"
          RESPONSE_DEST="research/afh_default_density_natural_xenon_halo/output/afh_default_xenon_responses"
          MPMATH_DEST="$RESPONSE_DEST/selected_q_mpmath"
          mkdir -p "$MATRIX_DEST" "$RESPONSE_DEST" "$MPMATH_DEST"
          cp -a "$RUNNER_TEMP/afh_default_density_matrices/." "$MATRIX_DEST/"
          cp -a "$RUNNER_TEMP/afh_default_xenon_responses/." "$RESPONSE_DEST/"
          cp -a "$RUNNER_TEMP/afh_selected_q_mpmath/." "$MPMATH_DEST/"
          (
            cd research/afh_default_density_natural_xenon_halo
            find input/afh_default_density_matrices output/afh_default_xenon_responses \
              -type f -print0 | sort -z | xargs -0 sha256sum \
              > output/afh_default_xenon_responses/SHA256SUMS.txt
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MATRIX_DEST" "$RESPONSE_DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Archive seven-isotope AFH default xenon response grids"
            git fetch origin research/ame2020-mass-exact-spatial-mainline
            git rebase origin/research/ame2020-mass-exact-spatial-mainline
            git push origin HEAD:research/ame2020-mass-exact-spatial-mainline
          fi
