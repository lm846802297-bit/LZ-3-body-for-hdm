name: Figure 2 Anand W_M nuclear response

on:
  push:
    branches:
      - research/figure2-p0-4-mainline
    paths:
      - .github/workflows/figure2-anand-wm-response.yml
      - research/figure2_full_reproduction/run_anand_wm_response.py

permissions:
  contents: write

jobs:
  reproduce-xenon-response:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install numerical and Fortran dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make python3-numpy python3-scipy python3-matplotlib

      - name: Fetch pinned dmscatter implementation
        run: |
          git clone https://github.com/ogorton/dmscatter.git /tmp/dmscatter
          git -C /tmp/dmscatter checkout d5c4046b4d4cd715af12f1251fac40b6e25b85d5
          test "$(git -C /tmp/dmscatter rev-parse HEAD)" = "d5c4046b4d4cd715af12f1251fac40b6e25b85d5"

      - name: Compile dmscatter
        run: make -C /tmp/dmscatter/make dmscatter

      - name: Compute Xe-131 and natural-xenon W_M responses
        run: |
          python3 -u research/figure2_full_reproduction/run_anand_wm_response.py \
            --dmscatter-root /tmp/dmscatter \
            --output /tmp/anand_wm_response

      - name: Upload complete raw and processed calculation archive
        uses: actions/upload-artifact@v4
        with:
          name: anand-wm-xenon-response
          path: /tmp/anand_wm_response/
          if-no-files-found: error
          retention-days: 90

      - name: Archive processed results in the research branch
        run: |
          mkdir -p research/figure2_full_reproduction/results/anand_wm_response
          rsync -a --exclude='raw_runs/' /tmp/anand_wm_response/ \
            research/figure2_full_reproduction/results/anand_wm_response/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/figure2_full_reproduction/results/anand_wm_response
          if ! git diff --cached --quiet; then
            git commit -m "Archive Anand xenon W_M response reproduction"
            git push
          fi
