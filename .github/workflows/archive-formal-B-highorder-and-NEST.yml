name: Archive accepted formal B high-order Halo and LZ NEST outputs

on:
  push:
    branches:
      - research/freeze-formal-B-highorder-halo-20261120
    paths:
      - research/artifact_archives/requests/formal-B-highorder-and-NEST-2026-11-20.json

permissions:
  actions: read
  contents: write

concurrency:
  group: archive-formal-B-highorder-and-NEST-2026-11-20
  cancel-in-progress: false

jobs:
  archive-native-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out archive branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download, verify, and extract immutable source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request
          import zipfile

          root = pathlib.Path.cwd()
          request_path = root / "research/artifact_archives/requests/formal-B-highorder-and-NEST-2026-11-20.json"
          request = json.loads(request_path.read_text(encoding="utf-8"))
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          archive = root / request["archive_directory"]
          archive.mkdir(parents=True, exist_ok=True)
          (archive / "source_artifacts").mkdir(exist_ok=True)
          (archive / "native").mkdir(exist_ok=True)
          (archive / "provenance").mkdir(exist_ok=True)

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def api_json(url):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          def download_artifact(artifact_id, destination):
              url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"
              subprocess.run([
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "-H", "Accept: application/vnd.github+json",
                  "-H", f"Authorization: Bearer {token}",
                  "-H", "X-GitHub-Api-Version: 2022-11-28",
                  url, "--output", str(destination),
              ], check=True)
              with destination.open("rb") as stream:
                  if stream.read(2) != b"PK":
                      raise RuntimeError(f"Artifact endpoint did not return a ZIP for {artifact_id}")

          manifest = {
              "archive_status": "NATIVE_OUTPUTS_ARCHIVED_AND_SHA256_VERIFIED",
              "created_from_request": request_path.relative_to(root).as_posix(),
              "artifacts": [],
              "additional_reproduction_inputs": request.get("additional_reproduction_inputs", []),
          }

          for item in request["artifacts"]:
              key = item["key"]
              run_meta = api_json(f"https://api.github.com/repos/{repo}/actions/runs/{item['run_id']}")
              artifact_meta = api_json(f"https://api.github.com/repos/{repo}/actions/artifacts/{item['artifact_id']}")
              if artifact_meta.get("expired"):
                  raise RuntimeError(f"Source artifact {item['artifact_id']} has expired")
              api_digest = (artifact_meta.get("digest") or "").replace("sha256:", "")
              if api_digest and api_digest != item["sha256"]:
                  raise RuntimeError(f"API artifact digest mismatch for {key}: {api_digest}")
              zip_path = archive / "source_artifacts" / f"{key}.zip"
              download_artifact(item["artifact_id"], zip_path)
              actual_digest = sha256(zip_path)
              if actual_digest != item["sha256"]:
                  raise RuntimeError(f"Downloaded ZIP SHA-256 mismatch for {key}: {actual_digest}")
              extract_path = archive / "native" / key
              if extract_path.exists():
                  import shutil
                  shutil.rmtree(extract_path)
              extract_path.mkdir(parents=True)
              with zipfile.ZipFile(zip_path) as zf:
                  for member in zf.infolist():
                      p = pathlib.PurePosixPath(member.filename)
                      if p.is_absolute() or ".." in p.parts:
                          raise RuntimeError(f"Unsafe ZIP member in {key}: {member.filename}")
                  zf.extractall(extract_path)

              checksum_file = extract_path / "SHA256SUMS"
              if checksum_file.exists():
                  subprocess.run(["sha256sum", "--check", "SHA256SUMS"], cwd=extract_path, check=True)
              else:
                  files = sorted(p for p in extract_path.rglob("*") if p.is_file())
                  with (extract_path / "SHA256SUMS").open("w", encoding="utf-8") as out:
                      for path in files:
                          if path.name != "SHA256SUMS":
                              out.write(f"{sha256(path)}  {path.relative_to(extract_path).as_posix()}\n")
                  subprocess.run(["sha256sum", "--check", "SHA256SUMS"], cwd=extract_path, check=True)

              (archive / "provenance" / f"{key}_run.json").write_text(
                  json.dumps(run_meta, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              (archive / "provenance" / f"{key}_artifact.json").write_text(
                  json.dumps(artifact_meta, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              manifest["artifacts"].append({
                  "key": key,
                  "run_id": item["run_id"],
                  "run_name": run_meta.get("name"),
                  "run_head_sha": run_meta.get("head_sha"),
                  "run_conclusion": run_meta.get("conclusion"),
                  "artifact_id": item["artifact_id"],
                  "artifact_name": artifact_meta.get("name"),
                  "artifact_sha256": actual_digest,
                  "artifact_size_bytes": zip_path.stat().st_size,
                  "zip_path": zip_path.relative_to(archive).as_posix(),
                  "extracted_path": extract_path.relative_to(archive).as_posix(),
              })
              print(f"Archived {key}: {zip_path.stat().st_size} bytes; SHA-256 {actual_digest}")

          manifest_path = archive / "RUN_MANIFEST.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          readme = """# Frozen formal B high-order Halo and LZ NEST outputs

          This archive combines three separately versioned native output artifacts:

          1. PR #93 high-order seven-isotope Halo comparison (A/source nucleon baseline).
          2. Formal B finite-nucleon reweight of that exact accepted high-order Halo source, with three strange-current alternatives and 3,000 correlated electromagnetic covariance draws.
          3. PR #87 four-benchmark event-weighted NEST response fold.

          These are not a single common benchmark: the PR #86 Halo comparison and PR #87 production detector benchmarks remain distinct, as recorded in their native metadata. The NEST fold is a diagnostic response product, not a completed official LZ selection or likelihood.

          The NEST artifact explicitly records formal_pass = null and DIAGNOSTIC_ONLY_NO_PREDECLARED_TOLERANCE. Its exact raw-rate closure is archived, while its replica spread and 2D map TV remain diagnostics. It uses a uniform active-TPC spatial proxy and does not include the official fiducial-volume map, SS/data-analysis response, Skin/OD sample migration, or background likelihood.

          All source ZIP digests are checked against GitHub's artifact API. Each extracted artifact's own SHA256SUMS is verified or generated, and the top-level SHA256SUMS covers every archived file. Recheck with sha256sum -c SHA256SUMS from this directory.
          """
          (archive / "README.md").write_text(readme, encoding="utf-8")
          PY

      - name: Generate and verify top-level archive checksum manifest
        run: |
          set -euo pipefail
          cd research/lz_detector_response/results/2026-11-20-formal-B-highorder-and-NEST
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Commit immutable native results and provenance
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/lz_detector_response/results/2026-11-20-formal-B-highorder-and-NEST
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git commit -m "Archive accepted formal B high-order Halo and LZ NEST outputs"
          git push origin "HEAD:${TARGET_BRANCH}"
